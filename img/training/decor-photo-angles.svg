<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="DM Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="640" height="520" fill="#FBF9FF"/>
  <text x="320" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#2D2140">Where to stand for the 4 decor photos</text>
  <text x="320" y="52" text-anchor="middle" font-size="13" fill="#6B6280">View from above (like looking down from the ceiling)</text>

  <!-- room -->
  <rect x="40" y="70" width="560" height="420" rx="10" fill="#fff" stroke="#C9B3EE" stroke-width="3"/>
  <!-- wall -->
  <rect x="40" y="70" width="560" height="18" fill="#C9B3EE"/>
  <text x="320" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">WALL</text>

  <!-- decor -->
  <path d="M200 92 Q320 170 440 92" fill="none" stroke="#E65A96" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 14"/>
  <rect x="230" y="92" width="180" height="26" rx="6" fill="#F7B6D2"/>
  <text x="320" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2140">DECOR (backdrop + arch)</text>

  <!-- view lines -->
  <g stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="320" y1="270" x2="320" y2="130" stroke="#6C4AB6"/>
    <line x1="110" y1="190" x2="225" y2="118" stroke="#6C4AB6"/>
    <line x1="530" y1="190" x2="415" y2="118" stroke="#6C4AB6"/>
    <line x1="320" y1="440" x2="160" y2="100" stroke="#E65A96"/>
    <line x1="320" y1="440" x2="480" y2="100" stroke="#E65A96"/>
  </g>

  <!-- markers -->
  <g font-weight="700" text-anchor="middle">
    <circle cx="320" cy="285" r="20" fill="#6C4AB6"/><text x="320" y="291" font-size="18" fill="#fff">1</text>
    <circle cx="100" cy="200" r="20" fill="#6C4AB6"/><text x="100" y="206" font-size="18" fill="#fff">2</text>
    <circle cx="540" cy="200" r="20" fill="#6C4AB6"/><text x="540" y="206" font-size="18" fill="#fff">3</text>
    <circle cx="320" cy="455" r="20" fill="#E65A96"/><text x="320" y="461" font-size="18" fill="#fff">4</text>
  </g>
  <g font-size="13" fill="#2D2140">
    <text x="345" y="280" font-weight="700">FRONT</text>
    <text x="345" y="296">Stand straight in front,</text>
    <text x="345" y="311">about 8–10 steps away</text>

    <text x="60" y="235" font-weight="700">LEFT SIDE</text>
    <text x="60" y="251">Stand to the left,</text>
    <text x="60" y="266">point at the decor</text>

    <text x="580" y="235" font-weight="700" text-anchor="end">RIGHT SIDE</text>
    <text x="580" y="251" text-anchor="end">Stand to the right,</text>
    <text x="580" y="266" text-anchor="end">point at the decor</text>

    <text x="350" y="450" font-weight="700">WIDE</text>
    <text x="350" y="466">Go to the far end / door</text>
    <text x="350" y="481">and get the whole room in</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wondershop Finance</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--mute:#77716a;--line:#e6e1d8;--pos:#1f7a4d;--neg:#b3362b;--acc:#5b3fd1;--accs:#e9e4fb;--est:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#201f1c;--ink:#f1ede6;--mute:#9b958c;--line:#34312c;--pos:#4cc38a;--neg:#f07b6f;--acc:#a996ff;--accs:#2c2550;--est:#e0a84a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}h1 small{color:var(--mute);font-weight:400;font-size:12px;margin-left:8px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;gap:4px;padding:10px 24px;overflow-x:auto}nav button{border:none;background:none;padding:8px 14px;border-radius:999px;white-space:nowrap}
nav button.on{background:var(--accs);color:var(--acc);font-weight:600}
main{padding:8px 24px 48px;max-width:1400px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0 20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.kpi .l{color:var(--mute);font-size:12px}.kpi .v{font-size:22px;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .s{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow-x:auto}
.card h2{font-size:15px;margin:0 0 4px}.card p.note{color:var(--mute);font-size:12px;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
thead th{color:var(--mute);font-weight:500;font-size:12px}tr.b td{font-weight:650}tr.pct td{color:var(--mute);font-style:italic;font-size:12px}tr.sec td{border-top:2px solid var(--line)}
.neg{color:var(--neg)}.pos{color:var(--pos)}.est{color:var(--est)}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 0 0;border-bottom:1px solid var(--line);position:relative}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;position:relative;min-width:22px}
.bars .bar{width:70%;border-radius:4px 4px 0 0;background:var(--acc)}.bars .bar.n{background:var(--neg);border-radius:0 0 4px 4px}
.bars .lab{font-size:10px;color:var(--mute);margin-top:4px;position:absolute;bottom:-18px}
.bars .val{font-size:10px;color:var(--mute)}
.chartwrap{padding-bottom:24px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--accs);color:var(--acc)}
details summary{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}header,main,nav{padding-left:16px;padding-right:16px}}
#drop{display:none}
</style></head><body>
<header><h1>Wondershop Finance<small id="gen"></small></h1>
<div class="ctl">
<label>Period <select id="fy"></select></label>
<label title="Full-time employees used for revenue per FTE">FTEs <input id="fte" type="number" step="0.5" min="0.5" style="width:70px"></label>
<button id="logout">Log out</button>
</div></header>
<div id="gate" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:20;align-items:center;justify-content:center;padding:16px"><form id="gateF" class="card" style="width:340px;display:flex;flex-direction:column;gap:10px"><h2>Wondershop Finance</h2><p class="note">Log in with the admin password (same as the admin page).</p><input id="gateName" placeholder="Your name" required><input id="gatePw" type="password" placeholder="Admin password" required><button class="pri">Log in</button><div id="gateErr" class="neg" style="font-size:13px"></div></form></div>
<nav id="tabs"></nav>
<main id="app"></main>
<script>
</script>
<script>
const API='https://wondershop-website-production.up.railway.app';
let DATA=null, WB=null, META=null, BOOK=[], PARTNERS=[];
const getPw=()=>{try{return localStorage.getItem('ws_admin_pw')||''}catch(e){return ''}};
const getName=()=>{try{return localStorage.getItem('ws_admin_name')||''}catch(e){return ''}};
async function api(path,opts={}){opts.headers={'Content-Type':'application/json','X-Admin-Password':getPw()};
 const r=await fetch(API+'/api/admin/finance'+path,opts);
 if(r.status===401||r.status===403){showGate(r.status===403?'Finance needs the admin login (not the sales login).':'Incorrect password, or session expired.');throw new Error('auth')}
 if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.detail||('Request failed ('+r.status+')'))}return r.json()}
function showGate(msg){$('#gate').style.display='flex';$('#gateErr').textContent=msg||''}
async function boot(){if(!getPw()){showGate();return}
 try{const [c,bk]=await Promise.all([api('/costs'),api('/bookings').catch(e=>{if(e.message==='auth')throw e;console.warn(e);return []})]);BOOK=bk;fetch(API+'/api/admin/vendors/names',{headers:{'X-Admin-Password':getPw()}}).then(r=>r.ok?r.json():{names:[]}).then(j=>{PARTNERS=j.names||[];if(tab==='costs')render()}).catch(()=>{});$('#gate').style.display='none';
  DATA=null;META=null;COSTS=c;setupFY();render()}catch(e){if(e.message!=='auth')$('#app').innerHTML='<div class="card neg">'+e.message+'</div>'}}
const $=s=>document.querySelector(s);
const inr=v=>{if(v==null||isNaN(v))return'–';const n=Math.round(v),s=Math.abs(n).toLocaleString('en-IN');return(n<0?'-₹':'₹')+s};
const lakh=v=>(v<0?'-':'')+'₹'+(Math.abs(v)/1e5).toFixed(2)+'L';
const pct=v=>isFinite(v)?(v*100).toFixed(0)+'%':'–';
const cls=v=>v<0?'neg':'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lbl=k=>MN[+k.slice(4)-1]+" '"+k.slice(2,4);
const store={get(k,d){try{const v=localStorage.getItem('wsf_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('wsf_'+k,JSON.stringify(v))}catch(e){}}};
let tab=store.get('tab','overview');
$('#fte').value=store.get('fte',2);
const TABS=[['overview','Overview'],['pl','P&L'],['ebitda','EBITDA'],['cash','Cash flow'],['events','Events GM%'],['team','Revenue / FTE'],['costs','+ Other costs']];
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){tab=k;store.set('tab',k);render()}};
$('#fte').oninput=()=>{store.set('fte',+$('#fte').value);render()};
$('#fy').onchange=render;
const useBook=()=>true;


function setupFY(){const ks=allMonths().map(m=>m.ym);if(!ks.length)ks.push('202610');const fys0=[...new Set(ks.map(k=>{const y=+k.slice(0,4),m=+k.slice(4);return m>=4?y:y-1}))].sort().reverse();const fys=fys0;
 const prev=$('#fy').value;$('#fy').innerHTML=`<option value="last12">Last 12 months</option>`+fys.map(y=>`<option value="${y}">FY ${y}-${String(y+1).slice(2)}</option>`).join('');
 $('#fy').value=prev||String(fys[0]);$('#gen').textContent='from Bookings + costs entered here'}
// 2026-10-16 — marketing costs carry a lead source; payment mode as on bookings.
const PAY_MODES=['Pending','Gpay','Cash','Bank transfer','UPI (other)','Card'];
const LEAD_SOURCES=['Instagram','Google','Wonderfest Feb 2026','Powai Rotary Christmas Stall 2025','Brand / general'];
const LS_RULES=[[/facebook|instagram|meta|aisensy/i,'Instagram'],[/google/i,'Google'],[/wonderfest/i,'Wonderfest Feb 2026'],[/rotary/i,'Powai Rotary Christmas Stall 2025']];
const defLS=p=>{for(const [rx,s] of LS_RULES)if(rx.test(p||''))return s;return ''};
const todayIST=()=>new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
const dlbl=c=>c.spent_on?new Date(c.spent_on+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'2-digit'}):lbl(c.ym);
const CATS={man:'Manpower',rent:'Rent',elec:'Electricity',wifi:'Wifi & mobile',mkt:'Marketing & ads',shopx:'Shop expenses',other:'Other (transport, cleaning, misc.)'};
let COSTS=[];
const ZERO=ym=>({ym,sales:0,net:0,cogs:0,mat:0,evCost:0,stall:0,mkt:0,man:0,rent:0,elec:0,wifi:0,shopx:0,other:0,capex:0,inv:0,ch:{},bd:{sales:0,net:0,cogs:0,cashIn:0,recv:0,vendor:0,vendorPaid:0},cashIn:0,cashOut:0,recv:0,pay:0,ownerIn:0,estimated:{}});
function withManual(m){const x={...m,ch:{...m.ch},estimated:m.estimated||{},manual:{}};
 if(useBook()){const b=m.bd||ZERO().bd;x.sales-=b.sales;x.net-=b.net;x.cogs-=b.cogs;x.cashIn-=b.cashIn;x.recv-=b.recv;x.evCost-=b.vendor;x.cashOut-=b.vendorPaid;x.pay-=(b.vendor-b.vendorPaid);delete x.ch.Birthday;
  for(const k of BOOK){if(k.ym!==m.ym)continue;x.sales+=k.revenue;x.net+=k.revenue;x.ch['Birthday (bookings)']=(x.ch['Birthday (bookings)']||0)+k.revenue;x.evCost+=k.cost;x.cashOut+=k.cost-k.cost_unpaid;x.pay+=k.cost_unpaid;x.cashIn+=k.paid_amount||0;x.recv+=Math.max(0,k.revenue-(k.paid_amount||0))}}
 for(const c of COSTS){if(c.ym!==m.ym)continue;x[c.category]=(x[c.category]||0)+c.amount;x.manual[c.category]=1;if(c.paid)x.cashOut+=c.amount;else x.pay+=c.amount}
 x.direct=x.cogs+x.mat+x.evCost+x.stall;x.gm=x.net-x.direct;x.fixed=x.man+x.rent+x.elec+x.wifi+x.shopx+x.other;x.ebitda=x.gm-x.mkt-x.fixed;x.netCash=x.cashIn-x.cashOut;return x}
function allMonths(){const base=(DATA?DATA.months:[]).slice();const extra=COSTS.filter(c=>c.ym>='202610').map(c=>c.ym)/* 2026-10-17: pre-Oct-2026 marketing history (for the Sales Dashboard) stays out of the P&L, which starts Oct 2026 */.concat(useBook()?BOOK.map(b=>b.ym).filter(Boolean):[]);
 for(const k of extra)if(!base.some(m=>m.ym===k))base.push(ZERO(k));return base.sort((a,b)=>a.ym<b.ym?-1:1).map(withManual)}
function months(){const v=$('#fy').value;let ms=allMonths().filter(m=>m.net||m.cashOut||m.fixed||m.mkt);
 if(v==='last12')return ms.slice(-12);const y=+v;return ms.filter(m=>m.ym>=y+'04'&&m.ym<=(y+1)+'03')}
const sum=(ms,f)=>ms.reduce((a,m)=>a+(typeof f==='function'?f(m):m[f]),0);

function kpis(list){return `<div class="kpis">${list.map(([l,v,s,c])=>`<div class="kpi"><div class="l">${l}</div><div class="v ${c||''}">${v}</div><div class="s">${s||''}</div></div>`).join('')}</div>`}
function bars(ms,f,fmt){const vals=ms.map(f);const mx=Math.max(1,...vals.map(Math.abs));const hasNeg=vals.some(v=>v<0);
 return `<div class="chartwrap"><div class="bars">${ms.map((m,i)=>{const v=vals[i],h=Math.abs(v)/mx*85;
 const top=`<div style="height:${hasNeg?50:100}%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;width:100%">${v>=0?`<div class="val">${fmt(v)}</div><div class="bar" style="height:${h}%"></div>`:''}</div>`;
 const bot=hasNeg?`<div style="height:50%;display:flex;flex-direction:column;align-items:center;width:100%">${v<0?`<div class="bar n" style="height:${h}%"></div><div class="val">${fmt(v)}</div>`:''}</div>`:'';
 return `<div class="c" title="${lbl(m.ym)}: ${inr(v)}">${top}${bot}<div class="lab">${lbl(m.ym)}</div></div>`}).join('')}</div></div>`}
// cost as % of that period's revenue, in brackets (2026-10-28)
const shr=(v,rev)=>rev?` <span style="color:var(--mute);font-weight:400;font-size:11.5px">(${(v/rev*100).toFixed(0)}%)</span>`:'';
function table(ms,rowsDef,opts={}){const tot=opts.total!==false;
 let h=`<table><thead><tr><th></th>${ms.map(m=>`<th>${lbl(m.ym)}</th>`).join('')}${tot?'<th>Total</th>':''}</tr></thead><tbody>`;
 for(const r of rowsDef){if(r.sec){h+=`<tr class="sec"><td colspan="${ms.length+2}" style="color:var(--mute);font-size:12px">${r.sec}</td></tr>`;continue}
  const vals=ms.map(r.f);const T=r.tot?r.tot(ms):(r.pct?null:vals.reduce((a,b)=>a+b,0));
  h+=`<tr class="${r.b?'b':''} ${r.pct?'pct':''}"><td>${r.l}</td>${vals.map((v,i)=>{const e=r.e&&r.e(ms[i]);return `<td class="${cls(v)} ${e?'est':''}" ${e?'title="Estimated / includes costs entered on the Other costs tab"':''}>${r.pct?pct(v):inr(v)}${e?'*':''}${r.share?shr(v,ms[i].net):''}</td>`}).join('')}${tot?`<td class="${cls(T)}">${T==null?'':r.pct?pct(T):inr(T)}${r.share&&T!=null?shr(T,sum(ms,'net')):''}</td>`:''}</tr>`}
 return h+'</tbody></table>'}

const V={
overview(ms){const net=sum(ms,'net'),gm=sum(ms,'gm'),eb=sum(ms,'ebitda'),cash=sum(ms,'netCash'),fte=+$('#fte').value||1;
 const evs=useBook()?BOOK.filter(b=>ms.some(m=>m.ym===b.ym)&&b.cost>0).map(b=>({rev:b.revenue,gm:b.revenue-b.cost})):(DATA?DATA.events:[]).filter(e=>ms.some(m=>m.ym===e.ym)&&e.vendor+e.mat>0);const egm=evs.reduce((a,e)=>a+e.gm,0)/Math.max(1,evs.reduce((a,e)=>a+e.rev,0));
 return kpis([['Net sales',lakh(net),ms.length+' months'],['Gross margin',pct(gm/net),inr(gm)],['EBITDA',lakh(eb),pct(eb/net)+' of net sales',cls(eb)],['Net cash flow',lakh(cash),'operating, excl. owner funding',cls(cash)],['Event GM%',pct(egm),evs.length+' costed events'],['Revenue / FTE / month',inr(net/ms.length/fte),fte+' FTE']])
 +`<div class="grid2"><div class="card"><h2>Monthly EBITDA</h2>${bars(ms,m=>m.ebitda,v=>Math.round(v/1000)+'k')}</div><div class="card"><h2>Net sales</h2>${bars(ms,m=>m.net,v=>Math.round(v/1000)+'k')}</div></div>`
 +`<div class="card"><h2>Sales by channel</h2>${channelTable(ms)}</div>`},
pl(ms){return `<div class="card"><h2>Profit & Loss</h2><p class="note">Revenue = birthday bookings (event month). Event costs = Partners &amp; Expenses on each booking. Everything else = costs entered on the Other costs tab. <span class="est">*</span> = includes an estimate or a cost you added on the Other costs tab.</p>`+table(ms,[
 
 {l:'Revenue',f:m=>m.net,b:1},
 {sec:'Direct costs'},{l:'Event costs (vendors, partners & expenses)',share:1,f:m=>m.evCost},
 {l:'Total direct costs',share:1,f:m=>m.direct,b:1},{l:'Gross margin',f:m=>m.gm,b:1},{l:'GM %',f:m=>m.gm/m.net,pct:1,tot:x=>sum(x,'gm')/sum(x,'net')},
 {sec:'Operating expenses'},{l:'Marketing & ads',share:1,f:m=>m.mkt,e:m=>m.manual.mkt},{l:'Manpower',share:1,f:m=>m.man,e:m=>m.manual.man},{l:'Rent',share:1,f:m=>m.rent,e:m=>m.estimated.rent||m.manual.rent},{l:'Electricity',share:1,f:m=>m.elec,e:m=>m.estimated.elec||m.manual.elec},{l:'Wifi & mobile',share:1,f:m=>m.wifi,e:m=>m.estimated.wifi||m.manual.wifi},{l:'Shop expenses',share:1,f:m=>m.shopx,e:m=>m.manual.shopx},{l:'Other (transport, cleaning, misc.)',share:1,f:m=>m.other},
 {l:'EBITDA',f:m=>m.ebitda,b:1},{l:'EBITDA %',f:m=>m.ebitda/m.net,pct:1,tot:x=>sum(x,'ebitda')/sum(x,'net')}])+'</div>'},
ebitda(ms){return `<div class="card"><h2>Monthly EBITDA</h2>${bars(ms,m=>m.ebitda,v=>Math.round(v/1000)+'k')}</div><div class="card"><h2>EBITDA bridge</h2>`+table(ms,[
 {l:'Gross margin',f:m=>m.gm},{l:'– Marketing',f:m=>-m.mkt},{l:'– Fixed costs',f:m=>-m.fixed},{l:'EBITDA',f:m=>m.ebitda,b:1},{l:'EBITDA %',f:m=>m.ebitda/m.net,pct:1,tot:x=>sum(x,'ebitda')/sum(x,'net')},
 {l:'Fixed costs % of sales',f:m=>m.fixed/m.net,pct:1,tot:x=>sum(x,'fixed')/sum(x,'net')},{l:'Marketing % of sales',f:m=>m.mkt/m.net,pct:1,tot:x=>sum(x,'mkt')/sum(x,'net')},
 {l:'Break-even net sales',f:m=>(m.mkt+m.fixed)/Math.max(.01,m.gm/m.net)}])+'<p class="note" style="margin-top:10px">Break-even = net sales needed that month to cover marketing + fixed costs at that month\'s GM%.</p></div>'},
cash(ms){let run=0;const cum=ms.map(m=>run+=m.netCash);
 return `<div class="card"><h2>Monthly net cash flow</h2>${bars(ms,m=>m.netCash,v=>Math.round(v/1000)+'k')}</div><div class="card"><h2>Cash flow statement</h2><p class="note">Cash in = sales actually collected (excludes Pending, Internal Settle, Writeoff). Cash out = Purchase Group bills marked paid, incl. inventory & furniture. Bills marked Pending/Partial are shown as payables.</p>`+table(ms,[
 {sec:'Operating'},{l:'Cash collected from customers',f:m=>m.cashIn},{l:'Paid to suppliers & expenses',f:m=>-(m.cashOut)},{l:'Net operating cash',f:m=>m.netCash,b:1},
 {l:'Cumulative',f:(m,i)=>cum[ms.indexOf(m)],tot:()=>null},
 {sec:'Financing'},{l:'Owner funds transferred in',f:m=>m.ownerIn},
 {sec:'Not yet cash (by month booked)'},{l:'Sales still pending from customers',f:m=>m.recv},{l:'Bills still pending to vendors',f:m=>m.pay}])+'</div>'},
events(ms){const evs=(DATA?DATA.events:[]).filter(e=>ms.some(m=>m.ym===e.ym)&&!(useBook()&&e.ch==='Birthday'));const evM=store.get('evMonth','all');const bksAll=useBook()?BOOK.filter(b=>ms.some(m=>m.ym===b.ym)):[];const bkMonths=[...new Set(bksAll.map(b=>b.ym))].sort().reverse();const bks=evM==='all'?bksAll:bksAll.filter(b=>b.ym===evM);
 const mSel=`<label style="font-size:13px;color:var(--mute)">Month <select id="evMonth" onchange="store.set('evMonth',this.value);render()"><option value="all">All months</option>${bkMonths.map(k=>`<option value="${k}" ${k===evM?'selected':''}>${lbl(k)}</option>`).join('')}</select></label>`;const costed=evs.filter(e=>e.vendor+e.mat>0);
 const rev=costed.reduce((a,e)=>a+e.rev,0),gm=costed.reduce((a,e)=>a+e.gm,0);
 const un=(DATA?DATA.unmatched:[]).filter(u=>ms.some(m=>m.ym===u.ym));
 const bkC=bks.filter(b=>b.cost>0),bkRev=bkC.reduce((a,b)=>a+b.revenue,0),bkGm=bkC.reduce((a,b)=>a+b.revenue-b.cost,0);
 const bkHtml=useBook()?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Birthday bookings</h2>${mSel}</div><p class="note">Same figures as the booking page: revenue = Grand Total; costs = every row in the booking's Partners &amp; Expenses (hover a cost to see them); client paid = Advance Paid + Event Payment Confirmed. Cancelled bookings are left out. <span class="tag">no costs yet</span> = nothing logged in Partners &amp; Expenses.</p>${bks.length?`<table><thead><tr><th>Booking</th><th>Event date</th><th>Revenue</th><th>Costs</th><th>Gross margin</th><th>GM%</th><th>Costs unpaid</th><th>Client paid</th></tr></thead><tbody>${bks.map(b=>{const gm=b.revenue-b.cost;return `<tr><td>#${b.lead_id} ${esc(b.child||'')}${b.parent?' <span style="color:var(--mute)">('+esc(b.parent)+')</span>':''}</td><td>${b.date?new Date(b.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):''}</td><td>${inr(b.revenue)}</td><td title="${esc((b.costs||[]).map(c=>(c.partner||'?')+' ('+(c.category||'')+') '+inr(c.amount)+' · '+(c.paid_via||'')).join('\n'))}">${inr(b.cost)}${b.cost_lines?` <span style="color:var(--mute);font-size:11px">(${b.cost_lines})</span>`:''}</td><td class="${cls(gm)}">${inr(gm)}</td><td class="${cls(gm)}">${b.cost>0?pct(gm/b.revenue):'<span class="tag">no costs yet</span>'}</td><td>${b.cost_unpaid?inr(b.cost_unpaid):''}</td><td>${b.paid_amount?`<span title="Advance ${inr(b.advance||0)} + final ${inr(b.final_payment||0)}${b.paid_mode?' ('+esc(b.paid_mode)+')':''}">${inr(b.paid_amount)}</span>`+(b.revenue-b.paid_amount>0?` <span class="est" style="font-size:11px">due ${inr(b.revenue-b.paid_amount)}</span>`:''):''}</td></tr>`}).join('')}</tbody></table>`:'<p class="note">No bookings in this period.</p>'}</div>`:'';
 return (useBook()?kpis([['Birthday bookings',bks.length,bkC.length+' with costs logged'],['Booking revenue',lakh(bks.reduce((a,b)=>a+b.revenue,0))],['Birthday GM% (costed)',pct(bkGm/bkRev),inr(bkGm)],['Costs still unpaid',inr(bks.reduce((a,b)=>a+b.cost_unpaid,0))]]):'')+bkHtml
 +''},
team(ms){const fte=+$('#fte').value||1;return kpis([['FTEs',fte,'set at top'],['Avg revenue / FTE / month',inr(sum(ms,'net')/ms.length/fte)],['Avg GM / FTE / month',inr(sum(ms,'gm')/ms.length/fte)],['Manpower % of net sales',pct(sum(ms,'man')/sum(ms,'net'))]])
 +`<div class="card"><h2>Revenue per full-time employee</h2>${bars(ms,m=>m.net/fte,v=>Math.round(v/1000)+'k')}`+table(ms,[{l:'Net sales',f:m=>m.net},{l:'Revenue per FTE',f:m=>m.net/fte,b:1},{l:'Gross margin per FTE',f:m=>m.gm/fte},{l:'Manpower cost',f:m=>m.man},{l:'Revenue per ₹1 of manpower',f:m=>m.man?m.net/m.man:0,tot:x=>sum(x,'net')/sum(x,'man')}])+'<p class="note" style="margin-top:10px">Team: sales (₹21k + incentives), admin (₹15k), cleaner (₹1.5k, part-time) → default 2 FTE. Change it above if the team changes.</p></div>'}
};
V.costs=function(){const now=new Date();const dm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
 const rowsH=COSTS.map(c=>`<tr><td>${dlbl(c)}</td><td style="text-align:left">${CATS[c.category]||c.category}${c.category==='mkt'?`<br><select data-ls="${c.id}" style="font-size:12px;padding:2px 6px;margin-top:3px">${['',...LEAD_SOURCES.filter(x=>x!=='Brand / general')].map(x=>`<option value="${esc(x)}"${(c.lead_source||'')===x?' selected':''}>${x?esc(x):'Brand / general'}</option>`).join('')}${c.lead_source&&!LEAD_SOURCES.includes(c.lead_source)?`<option selected>${esc(c.lead_source)}</option>`:''}</select>`:''}</td><td style="text-align:left">${esc(c.partner||'')}${c.partner&&PARTNERS.length&&!PARTNERS.includes(c.partner)?' <span class="est">not in Partners</span>':''}${!c.partner?'<span class="est">no partner</span>':''}</td><td style="text-align:left">${esc(c.description||'')}</td><td>${inr(c.amount)}</td><td><select data-pv="${c.id}" style="font-size:12px;padding:2px 6px">${PAY_MODES.map(m=>`<option${(c.paid_via||(c.paid?'':'Pending'))===m?' selected':''}>${m}</option>`).join('')}${c.paid_via&&!PAY_MODES.includes(c.paid_via)?`<option selected>${esc(c.paid_via)}</option>`:''}</select></td><td style="color:var(--mute)">${c.created_by||''}</td><td><button data-del="${c.id}">Remove</button></td></tr>`).join('');
 return `<div class="card"><h2>Add a cost</h2><p class="note">Rent, salaries, wifi, electricity, cleaning, transport, ads, materials — Everything except event partner costs (those go on the booking's Partners & Expenses). They flow straight into P&L, EBITDA and cash flow, and are saved to the Wondershop database.</p>
 <form id="cf" style="display:flex;flex-wrap:wrap;gap:10px;align-items:end">
 <label>Date<br><input type="date" name="d" value="${todayIST()}" min="2026-10-01" required></label>
 <label>Category<br><select name="cat" id="cfCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
 <label style="min-width:200px">Partner (paid to)<br><input name="partner" id="cfPartner" list="plist" placeholder="e.g. office owner, staff name" style="width:100%" required><datalist id="plist">${PARTNERS.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
 <label style="flex:1;min-width:180px">Description<br><input name="desc" placeholder="e.g. Sales exec salary + incentive" style="width:100%"></label>
 <label>Amount (₹)<br><input name="amt" type="number" min="0" step="1" required style="width:120px"></label>
 <label id="cfLSWrap" style="display:none">Lead source<br><input name="ls" id="cfLS" list="lslist" placeholder="Brand / general" style="width:220px"><datalist id="lslist">${LEAD_SOURCES.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
 <label>Payment mode<br><select name="pv">${PAY_MODES.map(m=>`<option>${m}</option>`).join('')}</select></label>
 <button class="pri">Add</button></form>
 <p class="note" style="margin-top:10px">Every cost is paid to a partner from the Partners list on the admin page — add the office owner and each staff member there once (any category). A name not on the list still saves, but shows <span class="est">not in Partners</span>.</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="tmpl">Copy last month's recurring costs into the selected month</button></div></div>
 <div class="card"><h2>Costs you've added (${COSTS.length})</h2>${COSTS.length?`<table><thead><tr><th>Date</th><th style="text-align:left">Category / lead source</th><th style="text-align:left">Partner</th><th style="text-align:left">Description</th><th>Amount</th><th>Payment mode</th><th>Added by</th><th></th></tr></thead><tbody>${rowsH}</tbody></table>`:'<p class="note">Nothing added yet.</p>'}</div>`};
async function reloadCosts(){COSTS=await api('/costs');setupFY();render()}
async function addCosts(list){try{for(const c of list)await api('/costs',{method:'POST',body:JSON.stringify({...c,by:getName()})});await reloadCosts()}catch(e){if(e.message!=='auth')alert(e.message)}}
document.addEventListener('submit',e=>{if(e.target.id==='gateF'){e.preventDefault();try{localStorage.setItem('ws_admin_pw',$('#gatePw').value.trim());localStorage.setItem('ws_admin_name',$('#gateName').value.trim())}catch(err){}boot();return}
 if(e.target.id!=='cf')return;e.preventDefault();const f=new FormData(e.target);
 const ls=(f.get('ls')||'').trim();
 addCosts([{spent_on:f.get('d'),category:f.get('cat'),partner:f.get('partner').trim(),description:f.get('desc').trim(),amount:+f.get('amt'),paid_via:f.get('pv')||'Pending',lead_source:f.get('cat')==='mkt'&&ls!=='Brand / general'?ls:null}])});
// Lead source: only for Marketing; defaults from an obvious partner (Facebook/IG -> Instagram, Google Ads -> Google), can be overridden.
let LS_TOUCHED=false;
document.addEventListener('input',e=>{if(e.target.id==='cfLS')LS_TOUCHED=true;if(e.target.id==='cfPartner'&&!LS_TOUCHED){const ls=document.getElementById('cfLS');if(ls)ls.value=defLS(e.target.value)}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='cfCat'){const w=document.getElementById('cfLSWrap');if(w)w.style.display=t.value==='mkt'?'':'none';if(t.value==='mkt'&&!LS_TOUCHED){document.getElementById('cfLS').value=defLS(document.getElementById('cfPartner').value)}return}
 if(t.dataset&&t.dataset.pv!=null){try{await api('/costs/'+t.dataset.pv+'/paid',{method:'POST',body:JSON.stringify({paid_via:t.value})});await reloadCosts()}catch(err){if(err.message!=='auth')alert(err.message)}return}
 if(t.dataset&&t.dataset.ls!=null){try{await api('/costs/'+t.dataset.ls+'/lead-source',{method:'POST',body:JSON.stringify({lead_source:t.value||null})});await reloadCosts()}catch(err){if(err.message!=='auth')alert(err.message)}}});
document.addEventListener('click',async e=>{const t=e.target;
  if(t.dataset.del!=null){if(!confirm('Remove this cost?'))return;try{await api('/costs/'+t.dataset.del,{method:'DELETE'});await reloadCosts()}catch(err){if(err.message!=='auth')alert(err.message)}}
 if(t.id==='tmpl'){const m=document.querySelector('#cf [name=d]').value.slice(0,7).replace('-','');const y=+m.slice(0,4),mo=+m.slice(4);const prev=mo===1?(y-1)+'12':y+String(mo-1).padStart(2,'0');
  const src=COSTS.filter(c=>c.ym===prev);if(!src.length){alert('Nothing was added for '+lbl(prev)+' to copy.');return}
  if(COSTS.some(c=>c.ym===m)&&!confirm(lbl(m)+' already has costs. Copy '+src.length+' more from '+lbl(prev)+'?'))return;
  addCosts(src.map(c=>({spent_on:m.slice(0,4)+'-'+m.slice(4)+'-'+String(Math.min(28,+(c.spent_on||'').slice(8,10)||1)).padStart(2,'0'),category:c.category,partner:c.partner,lead_source:c.lead_source,description:c.description,amount:c.amount,paid_via:'Pending'})))}
 if(t.id==='logout'){try{localStorage.removeItem('ws_admin_pw')}catch(err){}location.reload()}});
function channelTable(ms){const chs=[...new Set(ms.flatMap(m=>Object.keys(m.ch)))].sort((a,b)=>sum(ms,m=>m.ch[b]||0)-sum(ms,m=>m.ch[a]||0));
 return table(ms,chs.map(c=>({l:c,f:m=>m.ch[c]||0})).concat([{l:'Total',f:m=>m.net,b:1}]))}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===tab));
 if(!DATA&&tab!=='costs'&&!COSTS.length&&!BOOK.length){$('#app').innerHTML='<div class="card">No data yet. Revenue comes from confirmed bookings (Oct 2026 on) and costs from Partners &amp; Expenses plus the <b>+ Other costs</b> tab.</div>';return}
 if(tab==='costs'){$('#app').innerHTML=V.costs();return}
 const ms=months();$('#app').innerHTML=ms.length?V[tab](ms):'<div class="card">No data for this period.</div>'}

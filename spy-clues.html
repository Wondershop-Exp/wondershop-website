<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Spy Clues – Wondershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  Spy clue envelopes — ops (Shilpa) side (2026-11-19, per Shruti: "She has a
  very basic education, 10th pass, so UI needs to be very simple").
  One card per envelope: the colour + number, which clue goes inside, and the
  name to write on it, then one big DONE button. Ticks are saved on the server,
  so two phones can work together. Opened as spy-clues.html?t=<token>; the
  link stops working when it expires or is stopped from spy-clues-admin.html.
  Backend: backend/routers/spy_clues.py (/api/spy-clue-job/<token>).
-->
<style>
/* Same family as the main site: lilac wash, white surfaces, Lora + DM Sans.
   The team colour is only an accent (the envelope flap, a dot) — never a
   full flood — and pink is kept for the one thing she must copy: the name. */
:root{--li:#B59DDE;--li2:#EDE6FA;--li3:#F5F0FF;--pk:#E65A96;--bk:#191919;--gy:#6B7280;--line:#E7E0F3;--ok:#2F8F55;--okbg:#EAF6EE;--amb:#9A6700;--ambbg:#FFF4D6;--fd:'Lora',serif;--fb:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--fb);color:var(--bk);background:var(--li3);font-size:17px;line-height:1.4}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--li);outline-offset:2px}
#msg{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:32px;text-align:center;color:var(--gy);font-size:19px;max-width:420px;margin:0 auto}
#msg .big{font-size:52px}
#app{display:none;max-width:520px;margin:0 auto;padding-bottom:56px}
.top{background:#fff;padding:18px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .brand{font-size:14px;color:var(--pk);font-weight:700}
.top h1{margin:2px 0 4px;font-family:var(--fd);font-weight:700;font-size:26px;line-height:1.15}
.top .date{font-size:15px;color:var(--gy)}
.prog{margin-top:12px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700;color:var(--gy)}
.prog .bar{flex:1;height:8px;border-radius:9px;background:var(--li2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;padding:16px 16px 4px}
.tab{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px;font-weight:700;color:var(--bk);position:relative}
.tab .nm{display:flex;align-items:center;gap:7px}
.tab .dot{width:12px;height:12px;border-radius:50%;background:var(--tc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.tab small{font-size:14px;font-weight:500;color:var(--gy)}
.tab.on{border-color:var(--tc);background:var(--tt)}
.tab.full small{color:var(--ok);font-weight:700}
.list{display:flex;flex-direction:column;gap:16px;padding:14px 16px 0}
/* envelope card: a flap in the team colour, then the two things to do */
.env{background:#fff;border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative}
.env .flap{height:38px;background:var(--tt);clip-path:polygon(0 0,100% 0,50% 100%);border-top:4px solid var(--tc)}
.env .in{padding:0 20px 20px;margin-top:-26px;display:flex;flex-direction:column;gap:6px}
.env .eno{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.env .eno b{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:#fff;border:2px solid var(--tc);font-size:22px;font-weight:800}
.env .eno span{font-size:15px;color:var(--gy);text-align:right}
.lbl{font-size:14px;color:var(--gy);font-weight:500}
.clue{font-family:var(--fd);font-weight:700;font-size:23px;line-height:1.2;margin-bottom:10px}
.namebox{border:2px dashed #D9CDEB;border-radius:12px;padding:10px 14px;font-size:28px;font-weight:800;letter-spacing:.03em;color:var(--pk);text-transform:uppercase;line-height:1.15;word-break:break-word}
.namebox.missing{border-color:#E9C46A;background:var(--ambbg);color:var(--amb);font-size:16px;text-transform:none;letter-spacing:0;font-weight:700}
.from{font-size:14px;color:var(--gy);margin-top:2px}
.done-btn{margin-top:14px;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-size:20px;font-weight:700;cursor:pointer}
.done-btn:active{transform:scale(.985)}
.done-btn:disabled{background:#C9C4D3;cursor:not-allowed}
.changed{background:var(--ambbg);color:var(--amb);border-radius:10px;padding:10px 12px;font-weight:700;font-size:15px;margin-bottom:6px}
.env.isdone{background:var(--okbg);border-color:transparent}
.env.isdone .row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.env.isdone .row b{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#fff;border:2px solid var(--tc);font-size:18px;font-weight:800}
.env.isdone .row .who{flex:1;font-weight:700;color:var(--ok);font-size:17px}
.undo{border:1.5px solid #B9B3C4;background:#fff;color:var(--gy);border-radius:10px;font-size:14px;font-weight:700;padding:7px 12px;cursor:pointer}
.cheer{margin:14px 16px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.cheer .t{font-family:var(--fd);font-weight:700;font-size:22px;color:var(--ok)}
.next{border:2px solid var(--tc);background:var(--tt);color:var(--bk);border-radius:14px;padding:12px 22px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.next .dot{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.foot{text-align:center;color:var(--gy);font-size:14px;padding:28px 16px 0}
.foot button{border:0;background:none;color:var(--bk);font-size:14px;text-decoration:underline;cursor:pointer;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bk);color:#fff;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;display:none;z-index:9;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#sheet{display:none}
@media print{
  #app>*:not(#sheet){display:none!important}
  #sheet{display:block}
  body{background:#fff;font-size:12px}
  #sheet table{width:100%;border-collapse:collapse;margin-bottom:10px;page-break-inside:avoid}
  #sheet td,#sheet th{border:1px solid #999;padding:4px 6px;text-align:left}
}
</style>
</head>
<body>
<div id="msg"><div class="big">🕵️</div><div>Loading…</div></div>

<div id="app">
  <div class="top">
    <div class="brand">Wondershop spy clues</div>
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
    <div class="prog"><span id="count"></span><div class="bar"><i id="bar"></i></div></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="cheer"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div id="exp"></div>
    <button onclick="window.print()">Print the full list</button>
  </div>
  <div id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://wondershop-website-production.up.railway.app';
var token = new URLSearchParams(location.search).get('t') || '';
var V = null, team = 0, busy = false;
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fail(m, icon){ $('#app').style.display = 'none'; $('#msg').style.display = 'flex'; $('#msg').innerHTML = '<div class="big">' + (icon || '🔒') + '</div><div>' + esc(m) + '</div>'; }
function toast(m){ var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display = 'none'; }, 2600); }

function load(first){
  if (!token){ fail('This link is not complete. Please use the link exactly as Shruti or Sid sent it.'); return; }
  fetch(API + '/api/spy-clue-job/' + encodeURIComponent(token)).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok: r.ok, status: r.status, j: j}; });
  }).then(function(res){
    if (!res.ok){ fail(res.j.detail || 'Something went wrong. Please try again.', res.status === 410 ? '⌛' : '🔒'); return; }
    V = res.j;
    if (first){
      // open the first colour that still has work
      team = 0;
      for (var i = 0; i < V.teams.length; i++){ if (V.teams[i].done < V.teams[i].envelopes.length){ team = i; break; } }
    }
    render();
  }).catch(function(){ if (first) fail('No internet. Please check and open the link again.', '📶'); });
}

function render(){
  $('#msg').style.display = 'none'; $('#app').style.display = 'block';
  $('#title').textContent = V.title;
  $('#date').textContent = V.date_label + (V.kids ? ', ' + V.kids + ' kids' : '');
  $('#count').textContent = V.done + ' of ' + V.total + ' done';
  $('#bar').style.width = (V.total ? Math.round(100 * V.done / V.total) : 0) + '%';
  $('#exp').textContent = V.expires_label ? 'This link works till ' + V.expires_label : '';

  $('#tabs').innerHTML = V.teams.map(function(t, i){
    var full = t.done === t.envelopes.length;
    return '<button class="tab' + (i === team ? ' on' : '') + (full ? ' full' : '') + '" style="' + tv(t) + '" onclick="pick(' + i + ')">' +
      '<span class="nm"><span class="dot"></span>' + esc(t.name) + '</span><small>' + (full ? '✓ done' : t.done + ' of ' + t.envelopes.length) + '</small></button>';
  }).join('');

  var T = V.teams[team];
  var full = T.done === T.envelopes.length;
  var nextI = -1;
  for (var k = 1; k <= V.teams.length; k++){ var j = (team + k) % V.teams.length; if (V.teams[j].done < V.teams[j].envelopes.length){ nextI = j; break; } }
  if (full){
    $('#cheer').innerHTML = '<div class="cheer"><div class="t">' + (nextI >= 0 ? esc(T.name) + ' team is ready 🎉' : 'All envelopes are ready 🎉') + '</div>' +
      (nextI >= 0 ? '<button class="next" style="' + tv(V.teams[nextI]) + '" onclick="pick(' + nextI + ')"><span class="dot"></span>Start ' + esc(V.teams[nextI].name) + '</button>' : '') + '</div>';
  } else $('#cheer').innerHTML = '';

  $('#list').innerHTML = T.envelopes.map(function(e){
    var missing = !e.giver || e.giver === '?';
    if (e.done) return '<div class="env isdone" style="' + tv(T) + '"><div class="row"><b>' + e.no + '</b>' +
      '<span class="who">✓ ' + esc(e.giver) + '</span><button class="undo" onclick="tick(\'' + e.key + '\',false)">Undo</button></div></div>';
    return '<div class="env" style="' + tv(T) + '"><div class="flap"></div><div class="in">' +
      '<div class="eno"><b>' + e.no + '</b><span>' + esc(T.name) + ' envelope ' + e.no + ' of ' + T.envelopes.length + '</span></div>' +
      (e.changed ? '<div class="changed">This envelope was changed. Check the clue, rub out the old name and write the new one.</div>' : '') +
      '<div class="lbl">Put this clue inside</div><div class="clue">' + (e.final ? '🏁' : esc(e.icon)) + ' ' + esc(e.clue) + '</div>' +
      '<div class="lbl">Write this name on the envelope</div>' +
      (missing ? '<div class="namebox missing">Name not added yet. Ask Shruti or Sid.</div>'
               : '<div class="namebox">' + esc(e.giver) + '</div><div class="from">' + (e.no === 1 ? 'The host gives this envelope' : 'Given at ' + esc(e.giver_at)) + '</div>') +
      '<button class="done-btn" ' + (missing ? 'disabled' : '') + ' onclick="tick(\'' + e.key + '\',true)">Done</button>' +
      '</div></div>';
  }).join('');

  // print sheet: every team, every envelope
  $('#sheet').innerHTML = '<h2>' + esc(V.title) + ' – ' + esc(V.date_label || '') + '</h2>' + V.teams.map(function(t){
    return '<table><tr><th colspan="3" style="background:' + t.bg + ';color:' + t.fg + '">' + esc(t.name) + '</th></tr><tr><th>#</th><th>Clue inside</th><th>Name on envelope</th></tr>' +
      t.envelopes.map(function(e){ return '<tr><td>' + e.no + '</td><td>' + esc(e.clue) + '</td><td><b>' + esc(e.giver) + '</b></td></tr>'; }).join('') + '</table>';
  }).join('');
}

function tv(t){ var c = /^#f{6}$/i.test(t.bg) ? '#B8B3C2' : t.bg; return '--tc:' + c + ';--tt:' + c + '1F'; }
function pick(i){ team = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }

function tick(key, done){
  if (busy) return; busy = true;
  fetch(API + '/api/spy-clue-job/' + encodeURIComponent(token) + '/tick', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: key, done: done})
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok: r.ok, status: r.status, j: j}; });
  }).then(function(res){
    busy = false;
    if (!res.ok){ if (res.status === 410 || res.status === 404) fail(res.j.detail, '⌛'); else toast(res.j.detail || 'Not saved. Try again.'); return; }
    V = res.j; render();
    if (done) toast('✓ Saved');
  }).catch(function(){ busy = false; toast('No internet – not saved. Try again.'); });
}

load(true);
// pick up changes made by Shruti / Sid, and ticks from a second phone
setInterval(function(){ if (!busy && document.visibilityState === 'visible' && V) load(false); }, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Spy Clues – Wondershop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  Spy clue envelopes — ops (Shilpa) side (2026-11-19, per Shruti: "She has a
  very basic education, 10th pass, so UI needs to be very simple").
  One card per envelope: the colour + number, which clue goes inside, and the
  name to write on it, then one big DONE button. Ticks are saved on the server,
  so two phones can work together. Opened as spy-clues.html?t=<token>; the
  link stops working when it expires or is stopped from spy-clues-admin.html.
  Backend: backend/routers/spy_clues.py (/api/spy-clue-job/<token>).
-->
<style>
:root{--plum:#2E2438;--pk:#E65A96;--li:#B59DDE;--li3:#F5F0FF;--bk:#191919;--gy:#5B5568;--ok:#1E7A46;--okbg:#E3F4EA;--warn:#FFF1C2;--fd:'Lora',serif;--fb:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--fb);color:var(--bk);background:var(--li3);font-size:18px;line-height:1.35}
#msg{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:28px;text-align:center;color:var(--gy);font-size:20px}
#msg .big{font-size:60px}
#app{display:none;max-width:560px;margin:0 auto;padding-bottom:60px}
.top{background:var(--plum);color:#fff;padding:16px 16px 18px;position:sticky;top:0;z-index:5}
.top .brand{font-size:14px;font-weight:700;color:var(--li)}
.top h1{margin:2px 0 0;font-family:var(--fd);font-size:25px;line-height:1.15}
.top .date{font-size:16px;color:#F5C3D7;font-weight:700}
.prog{margin-top:10px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.prog .bar{flex:1;height:12px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#5BD08A;transition:width .3s}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;padding:12px}
.tab{border:4px solid transparent;border-radius:16px;padding:12px 6px;font:inherit;font-weight:800;font-size:19px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tab small{font-size:15px;font-weight:700;opacity:.9}
.tab.on{border-color:var(--plum);transform:scale(1.04)}
.tab.full{position:relative}
.tab.full::after{content:'✓';position:absolute;top:-8px;right:-6px;background:var(--ok);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:17px;border:2px solid #fff}
.list{display:flex;flex-direction:column;gap:14px;padding:0 12px}
.env{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 8px rgba(46,36,56,.1)}
.env .head{display:flex;align-items:center;gap:12px;padding:10px 14px}
.env .no{width:58px;height:58px;border-radius:14px;background:#fff;color:var(--bk);display:grid;place-items:center;font-size:34px;font-weight:800;border:3px solid rgba(0,0,0,.15)}
.env .head b{font-size:22px}
.env .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;margin-top:2px}
.step .t{font-size:15px;color:var(--gy);font-weight:700}
.step .v{font-size:24px;font-weight:800;line-height:1.2}
.step .v.name{font-size:30px;letter-spacing:.04em;text-transform:uppercase;color:var(--pk)}
.step .s{font-size:14px;color:var(--gy)}
.done-btn{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:inherit;font-size:24px;font-weight:800;cursor:pointer}
.done-btn:active{transform:scale(.98)}
.changed{background:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:16px}
.env.isdone{background:var(--okbg);box-shadow:none}
.env.isdone .body{display:none}
.env.isdone .head{padding:8px 14px}
.env.isdone .no{width:44px;height:44px;font-size:24px}
.env .tick{margin-left:auto;display:flex;align-items:center;gap:8px}
.env .tick span{color:var(--ok);font-weight:800;font-size:20px}
.undo{border:2px solid var(--gy);background:#fff;color:var(--gy);border-radius:10px;font:inherit;font-size:15px;font-weight:700;padding:6px 12px;cursor:pointer}
.cheer{margin:6px 12px 0;background:var(--okbg);border-radius:18px;padding:18px;text-align:center;font-size:22px;font-weight:800;color:var(--ok);display:flex;flex-direction:column;gap:12px;align-items:center}
.next{border:0;border-radius:14px;padding:14px 22px;font:inherit;font-size:21px;font-weight:800;cursor:pointer}
.foot{text-align:center;color:var(--gy);font-size:14px;padding:22px 12px 0}
.foot button{border:0;background:none;color:var(--plum);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bk);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;display:none;z-index:9;max-width:90vw;text-align:center}
/* print sheet */
#sheet{display:none}
@media print{
  #app>*:not(#sheet){display:none!important}
  #sheet{display:block}
  body{background:#fff;font-size:12px}
  #sheet table{width:100%;border-collapse:collapse;margin-bottom:10px;page-break-inside:avoid}
  #sheet td,#sheet th{border:1px solid #999;padding:4px 6px;text-align:left}
}
</style>
</head>
<body>
<div id="msg"><div class="big">🕵️</div><div>Loading…</div></div>

<div id="app">
  <div class="top">
    <div class="brand">WONDERSHOP · SPY CLUES</div>
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
    <div class="prog"><span id="count"></span><div class="bar"><i id="bar"></i></div></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="cheer"></div>
  <div class="list" id="list"></div>
  <div class="foot">
    <div id="exp"></div>
    <div style="margin-top:10px"><button onclick="window.print()">🖨 Print full list</button></div>
  </div>
  <div id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://wondershop-website-production.up.railway.app';
var token = new URLSearchParams(location.search).get('t') || '';
var V = null, team = 0, busy = false;
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fail(m, icon){ $('#app').style.display = 'none'; $('#msg').style.display = 'flex'; $('#msg').innerHTML = '<div class="big">' + (icon || '🔒') + '</div><div>' + esc(m) + '</div>'; }
function toast(m){ var t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(function(){ t.style.display = 'none'; }, 2600); }

function load(first){
  if (!token){ fail('This link is not complete. Please use the link exactly as Shruti or Sid sent it.'); return; }
  fetch(API + '/api/spy-clue-job/' + encodeURIComponent(token)).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok: r.ok, status: r.status, j: j}; });
  }).then(function(res){
    if (!res.ok){ fail(res.j.detail || 'Something went wrong. Please try again.', res.status === 410 ? '⌛' : '🔒'); return; }
    V = res.j;
    if (first){
      // open the first colour that still has work
      team = 0;
      for (var i = 0; i < V.teams.length; i++){ if (V.teams[i].done < V.teams[i].envelopes.length){ team = i; break; } }
    }
    render();
  }).catch(function(){ if (first) fail('No internet. Please check and open the link again.', '📶'); });
}

function render(){
  $('#msg').style.display = 'none'; $('#app').style.display = 'block';
  $('#title').textContent = V.title;
  $('#date').textContent = [V.date_label, V.kids_label].filter(Boolean).join(' · ');
  $('#count').textContent = V.done + ' / ' + V.total + ' done';
  $('#bar').style.width = (V.total ? Math.round(100 * V.done / V.total) : 0) + '%';
  $('#exp').textContent = V.expires_label ? 'This link works till ' + V.expires_label : '';

  $('#tabs').innerHTML = V.teams.map(function(t, i){
    var full = t.done === t.envelopes.length;
    return '<button class="tab' + (i === team ? ' on' : '') + (full ? ' full' : '') + '" style="background:' + t.bg + ';color:' + t.fg + '" onclick="pick(' + i + ')">' +
      esc(t.name) + '<small>' + t.done + ' / ' + t.envelopes.length + '</small></button>';
  }).join('');

  var T = V.teams[team];
  var full = T.done === T.envelopes.length;
  var nextI = -1;
  for (var k = 1; k <= V.teams.length; k++){ var j = (team + k) % V.teams.length; if (V.teams[j].done < V.teams[j].envelopes.length){ nextI = j; break; } }
  if (full){
    $('#cheer').innerHTML = '<div class="cheer"><div>🎉 ' + esc(T.name) + ' team – all done!</div>' +
      (nextI >= 0 ? '<button class="next" style="background:' + V.teams[nextI].bg + ';color:' + V.teams[nextI].fg + '" onclick="pick(' + nextI + ')">Next: ' + esc(V.teams[nextI].name) + ' →</button>'
                  : '<div>✅ ALL ENVELOPES ARE READY</div>') + '</div>';
  } else $('#cheer').innerHTML = '';

  $('#list').innerHTML = T.envelopes.map(function(e){
    var head = '<div class="head" style="background:' + (e.done ? 'transparent' : T.bg) + ';color:' + (e.done ? 'var(--bk)' : T.fg) + '">' +
      '<div class="no" style="' + (e.done ? 'border-color:' + T.bg : '') + '">' + e.no + '</div>' +
      '<b>' + esc(T.name) + ' ' + e.no + '</b>' +
      (e.done ? '<div class="tick"><span>✓ ' + esc(e.giver) + '</span><button class="undo" onclick="tick(\'' + e.key + '\',false)">Undo</button></div>' : '') +
      '</div>';
    if (e.done) return '<div class="env isdone">' + head + '</div>';
    return '<div class="env">' + head + '<div class="body">' +
      (e.changed ? '<div class="changed">⚠ This envelope was changed. Check the clue and name again (rub out the old name).</div>' : '') +
      '<div class="step"><div class="n">1</div><div><div class="t">Put this clue inside</div><div class="v">' + (e.final ? '🏁 ' : esc(e.icon) + ' ') + esc(e.clue) + '</div></div></div>' +
      '<div class="step"><div class="n">2</div><div><div class="t">Write this name on the envelope</div><div class="v name">' + esc(e.giver) + '</div>' +
        '<div class="s">' + (e.no === 1 ? 'Host gives this envelope' : 'Given at ' + esc(e.giver_at)) + '</div></div></div>' +
      '<button class="done-btn" onclick="tick(\'' + e.key + '\',true)">✓ DONE</button>' +
      '</div></div>';
  }).join('');

  // print sheet: every team, every envelope
  $('#sheet').innerHTML = '<h2>' + esc(V.title) + ' – ' + esc(V.date_label || '') + '</h2>' + V.teams.map(function(t){
    return '<table><tr><th colspan="3" style="background:' + t.bg + ';color:' + t.fg + '">' + esc(t.name) + '</th></tr><tr><th>#</th><th>Clue inside</th><th>Name on envelope</th></tr>' +
      t.envelopes.map(function(e){ return '<tr><td>' + e.no + '</td><td>' + esc(e.clue) + '</td><td><b>' + esc(e.giver) + '</b></td></tr>'; }).join('') + '</table>';
  }).join('');
}

function pick(i){ team = i; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }

function tick(key, done){
  if (busy) return; busy = true;
  fetch(API + '/api/spy-clue-job/' + encodeURIComponent(token) + '/tick', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key: key, done: done})
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){ return {ok: r.ok, status: r.status, j: j}; });
  }).then(function(res){
    busy = false;
    if (!res.ok){ if (res.status === 410 || res.status === 404) fail(res.j.detail, '⌛'); else toast(res.j.detail || 'Not saved. Try again.'); return; }
    V = res.j; render();
    if (done) toast('✓ Saved');
  }).catch(function(){ busy = false; toast('No internet – not saved. Try again.'); });
}

load(true);
// pick up changes made by Shruti / Sid, and ticks from a second phone
setInterval(function(){ if (!busy && document.visibilityState === 'visible' && V) load(false); }, 30000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Wondershop — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --li:#B59DDE;--li2:#EDE6FA;--li3:#F5F0FF;
  --pk:#E65A96;--spk:#F5C3D7;
  --yl:#FFC200;--syl:#FFFBDC;
  --bl:#5B8EDD;--sbl:#BCD8E8;
  --gr:#52C470;--sgr:#B7E0B8;
  --or:#F57A1A;
  --bk:#191919;--gy:#6B7280;--lgy:#F5F2FA;--wh:#FAFAFA;
  --r:14px;--rs:10px;
  --fd:'Lora',serif;--fb:'DM Sans',sans-serif;
}
*{box-sizing:border-box}
body{font-family:var(--fb);color:var(--bk);background:var(--wh);margin:0}
h1,h2,h3{font-family:var(--fd);line-height:1.2;margin:0}
button{cursor:pointer;font-family:var(--fb)}
input,textarea,select{font-family:var(--fb)}
a{color:var(--bl)}

/* ─── Gate ─── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--li3)}
.gate-card{background:#fff;border-radius:var(--r);padding:36px 32px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.gate-card h1{font-size:22px;margin-bottom:6px}
.gate-card p{color:var(--gy);font-size:13px;margin:0 0 18px}
.gate-card input{width:100%;padding:12px 14px;border:1px solid var(--li2);border-radius:var(--rs);font-size:15px;margin-bottom:10px}
.gate-card button{width:100%;padding:12px 14px;border:none;border-radius:var(--rs);background:var(--pk);color:#fff;font-weight:700;font-size:15px}
.gate-err{color:var(--pk);font-size:13px;margin-top:8px;min-height:16px}

/* ─── App shell ─── */
#app{display:none;max-width:1200px;margin:0 auto;padding:20px 20px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px 0 18px;border-bottom:1px solid var(--li2);margin-bottom:20px}
.topbar h1{font-size:20px}
.topbar .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gy)}
.topbar .who input{padding:6px 10px;border:1px solid var(--li2);border-radius:8px;font-size:13px;width:150px}
.linkbtn{background:none;border:none;color:var(--bl);font-size:13px;text-decoration:underline;padding:0}

/* ─── List view ─── */
.searchbar{display:flex;gap:10px;margin-bottom:16px}
.searchbar input{flex:1;padding:12px 14px;border:1px solid var(--li2);border-radius:var(--rs);font-size:15px}
.searchbar button{padding:12px 18px;border:none;border-radius:var(--rs);background:var(--bk);color:#fff;font-weight:600}
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--gy);padding:8px 10px;border-bottom:2px solid var(--li2)}
table.list td{padding:10px;border-bottom:1px solid var(--li2);font-size:14px}
table.list tr{cursor:pointer}
table.list tr:hover td{background:var(--li3)}
.status-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.status-Complete,.status-Converted{background:var(--sgr);color:#166534}
.status-New,.status-Upcoming{background:var(--sbl);color:#1e3a8a}
.status-ProposalSent,.status-InitialDiscussionsDone,.status-NegotiationsOngoing{background:var(--syl);color:#92400e}
.status-NotInterested,.status-DND,.status-Cancelled{background:var(--spk);color:#8a1a44}

/* ─── Sortable list headers ─── */
/* 2026-08-19, per Shruti follow-up: "give sort on status, created, event
   date. on clicking - the values should get sorted in desc/asc." */
table.list th.sortable{cursor:pointer;user-select:none}
table.list th.sortable:hover{color:var(--bk)}
.sort-arrow{margin-left:4px;font-size:10px;display:inline-block;min-width:8px}

/* ─── Locked record banner ─── */
/* 2026-08-19, per Shruti follow-up: "if a booking is marked as cancelled, no
   further updates can be done on the values of the booking. same for leads
   that are marked as not converted." */
.lock-banner{background:var(--spk);color:#8a1a44;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;margin-bottom:16px}

/* ─── Leads / Bookings tabs ─── */
.tabs{display:flex;gap:10px;margin-bottom:16px}
.tab-btn{position:relative;padding:10px 18px;border:1px solid var(--li2);border-radius:var(--rs);background:#fff;font-weight:600;font-size:14px;color:var(--gy)}
.tab-btn.active{background:var(--bk);color:#fff;border-color:var(--bk)}
.tab-bubble{display:none;position:absolute;top:-7px;right:-7px;background:var(--pk);color:#fff;font-size:11px;font-weight:700;border-radius:20px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}

/* ─── Detail view ─── */
.detail-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.detail-head h2{font-size:20px}
.detail-meta{font-size:12px;color:var(--gy)}
.section-block{margin-bottom:26px}
.status-card{background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.status-card .fld{display:flex;flex-direction:column;gap:4px;min-width:160px}
.status-card label{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--gy);font-weight:600}
.status-card select,.status-card input{padding:8px 10px;border:1px solid var(--li2);border-radius:8px;font-size:13px}
.status-card .btns{display:flex;gap:8px;margin-left:auto}
.status-card .btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700}
.status-card .btn.save{background:var(--bk);color:#fff}
.status-card .btn.convert{background:var(--gr);color:#fff}
.status-card .btn.cancel{background:var(--pk);color:#fff}
.section-block h3{font-size:15px;color:var(--pk);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
table.fields{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--rs);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
table.fields th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--gy);padding:8px 10px;background:var(--lgy)}
table.fields td{padding:8px 10px;border-top:1px solid var(--li2);vertical-align:top}
table.fields tr.removed td{opacity:.45;text-decoration:line-through}
table.fields tr.dirty td{background:#FFF7E0}
table.fields tr.dirty td.field-label{box-shadow:inset 3px 0 0 var(--pk)}
table.fields input,table.fields textarea,table.fields select{width:100%;border:1px solid var(--li2);border-radius:6px;padding:6px 8px;font-size:13px;background:#fff}
table.fields textarea{resize:vertical;min-height:32px}
.readonly-cell{color:var(--gy);font-size:13px;padding:6px 2px;display:block}
.readonly-cell.computed{font-style:italic}
.computed-note{font-size:10px;color:var(--gy);display:block;margin-top:2px}
.field-label{font-weight:600;font-size:13px;white-space:nowrap}
.field-label small{display:block;font-weight:400;color:var(--gy);font-size:10px}
.row-actions{display:flex;gap:6px;align-items:flex-start}
.mini-btn{padding:5px 9px;border:1px solid var(--li2);border-radius:6px;background:#fff;font-size:11px;font-weight:600}
.mini-btn.save{background:var(--bk);color:#fff;border-color:var(--bk)}
.mini-btn.remove{color:var(--pk);border-color:var(--spk)}
.mini-btn.restore{color:var(--gr);border-color:var(--sgr)}
.add-field-btn{margin-top:8px;padding:8px 14px;border:1px dashed var(--li);border-radius:8px;background:none;color:var(--li);font-size:12px;font-weight:600}
.mp-wrap{display:flex;flex-direction:column;gap:6px}
.mp-row{display:flex;gap:6px;align-items:center}
.mp-row select{flex:1;min-width:0}
.mp-qty{width:56px!important;flex:0 0 56px}
.mp-empty{color:var(--gy);font-size:12px;font-style:italic;padding:4px 0}

.log-section{margin-top:30px;border-top:2px solid var(--li2);padding-top:16px}
.log-section h3{font-size:15px;margin-bottom:10px}
.log-entry{font-size:13px;padding:8px 0;border-bottom:1px solid var(--li3);color:var(--bk)}
.log-entry .ts{color:var(--gy);font-size:11px}
.empty{color:var(--gy);font-size:13px;padding:20px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bk);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Wondershop Admin</h1>
    <p>Internal booking-management page. Not for customer access.</p>
    <input type="password" id="gatePw" placeholder="Admin password">
    <input type="text" id="gateName" placeholder="Your name (shown on edits you make)">
    <button onclick="tryLogin()">Enter</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>🎈 Wondershop Admin — Bookings</h1>
    <div class="who">
      Editing as <input type="text" id="whoName" onchange="saveName()">
      <button class="linkbtn" onclick="logout()">Log out</button>
    </div>
  </div>

  <div id="listView">
    <div class="searchbar">
      <input type="text" id="searchQ" placeholder="Search by name, phone, email, or booking ID..." onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabLeadBtn" onclick="switchTab('lead')">Leads<span class="tab-bubble" id="leadBubble"></span></button>
      <button class="tab-btn" id="tabBookingBtn" onclick="switchTab('booking')">Bookings<span class="tab-bubble" id="bookingBubble"></span></button>
    </div>
    <div id="leadTableWrap">
      <table class="list">
        <thead><tr>
          <th>ID</th><th>Parent</th><th>Phone</th>
          <th class="sortable" onclick="toggleSort('lead','event_date')">Event Date<span class="sort-arrow" id="arrow-lead-event_date"></span></th>
          <th>City</th>
          <th class="sortable" onclick="toggleSort('lead','status')">Status<span class="sort-arrow" id="arrow-lead-status"></span></th>
          <th class="sortable" onclick="toggleSort('lead','created')">Created<span class="sort-arrow" id="arrow-lead-created"></span></th>
          <th></th>
        </tr></thead>
        <tbody id="leadBody"></tbody>
      </table>
      <div class="empty" id="leadEmpty" style="display:none">No leads found.</div>
    </div>
    <div id="bookingTableWrap" style="display:none">
      <table class="list">
        <thead><tr>
          <th>ID</th><th>Parent</th><th>Phone</th>
          <th class="sortable" onclick="toggleSort('booking','event_date')">Event Date<span class="sort-arrow" id="arrow-booking-event_date"></span></th>
          <th>City</th>
          <th class="sortable" onclick="toggleSort('booking','status')">Status<span class="sort-arrow" id="arrow-booking-status"></span></th>
          <th class="sortable" onclick="toggleSort('booking','created')">Created<span class="sort-arrow" id="arrow-booking-created"></span></th>
          <th></th>
        </tr></thead>
        <tbody id="bookingBody"></tbody>
      </table>
      <div class="empty" id="bookingEmpty" style="display:none">No bookings found.</div>
    </div>
  </div>

  <div id="detailView" style="display:none">
    <button class="linkbtn" onclick="backToList()">&larr; Back to list</button>
    <div class="detail-head">
      <h2 id="detTitle"></h2>
      <div class="detail-meta" id="detMeta"></div>
    </div>
    <div id="statusBlock" class="section-block"></div>
    <div id="lockBanner"></div>
    <div id="sectionsContainer"></div>
    <div class="log-section">
      <h3>Modification Trail</h3>
      <div id="logContainer"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://wondershop-website-production.up.railway.app';
let CURRENT_LEAD_ID = null;
let CURRENT_DETAIL = null;

// Lead → Booking status workflow (2026-08-19, per Shruti, reworked the same
// day into a Leads-table/Bookings-table split — see migrations/018_booking_
// flag_and_status_simplify.sql) — populated once at boot from
// /api/admin/status-options (single source of truth is the backend's
// LEAD_STATUSES/BOOKING_DISPLAY_STATUSES/NON_CONVERT_REASONS in routers/admin.py).
// Lead rows get the full editable pipeline (LEAD_STATUS_OPTIONS); booking
// rows are read-only and only ever show one of BOOKING_DISPLAY_STATUSES
// (New/Upcoming/Complete/Cancelled), computed server-side from event_date.
let LEAD_STATUS_OPTIONS = [];
let BOOKING_DISPLAY_STATUSES = [];
let NON_CONVERT_REASON_OPTIONS = [];
let NON_CONVERT_STATUSES = ['Not Interested', 'DND'];
async function loadStatusOptions(){
  try{
    const d = await apiCall('/api/admin/status-options');
    LEAD_STATUS_OPTIONS = d.lead_status_options||[];
    BOOKING_DISPLAY_STATUSES = d.booking_display_statuses||[];
    NON_CONVERT_REASON_OPTIONS = d.non_convert_reason_options||[];
    NON_CONVERT_STATUSES = d.non_convert_statuses||NON_CONVERT_STATUSES;
  }catch(e){ /* list/detail views still work with an empty dropdown if this fails */ }
}

// Mirrors builder.html's #ld-gender select (2026-08-18, per Shruti).
const GENDER_OPTIONS = [
  {value:'', label:'Select'},
  {value:'Boy', label:'Boy'},
  {value:'Girl', label:'Girl'},
  {value:'Prefer not to say', label:'Prefer not to say'},
];

// Pincode → City auto-fill. Empty until Shruti sends the real mapping
// (2026-08-18) — onPincodeInput() below no-ops gracefully when a pincode
// isn't in here yet, so nothing breaks in the meantime. Once she shares the
// list, populate this as {"400001":"Mumbai", "411001":"Pune", ...}.
const PINCODE_CITY_MAP = {};
function onPincodeInput(pincode){
  const city = PINCODE_CITY_MAP[pincode];
  if(!city) return;   // no match yet — leave City exactly as the admin/customer entered it
  const cityEl = document.getElementById('fld_city_av');
  if(cityEl) cityEl.value = city;
}

function getPw(){ return localStorage.getItem('ws_admin_pw') || ''; }
function getName(){ return localStorage.getItem('ws_admin_name') || ''; }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

async function apiCall(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({'Content-Type':'application/json','X-Admin-Password':getPw()}, opts.headers||{});
  const res = await fetch(API+path, opts);
  if(res.status===401){
    localStorage.removeItem('ws_admin_pw');
    document.getElementById('app').style.display='none';
    document.getElementById('gate').style.display='flex';
    document.getElementById('gateErr').textContent='Session expired or password incorrect. Please log in again.';
    throw new Error('unauthorized');
  }
  if(!res.ok){
    const body = await res.json().catch(()=>({}));
    throw new Error(body.detail || ('Request failed ('+res.status+')'));
  }
  return res.json();
}

async function tryLogin(){
  const pw = document.getElementById('gatePw').value.trim();
  const name = document.getElementById('gateName').value.trim();
  const err = document.getElementById('gateErr');
  err.textContent='';
  if(!pw){ err.textContent='Enter the admin password.'; return; }
  if(!name){ err.textContent='Enter your name — it will be logged against any edits you make.'; return; }
  localStorage.setItem('ws_admin_pw', pw);
  localStorage.setItem('ws_admin_name', name);
  try{
    await apiCall('/api/admin/bookings');
  }catch(e){
    err.textContent = e.message==='unauthorized' ? 'Incorrect password.' : e.message;
    return;
  }
  enterApp();
}

function enterApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoName').value = getName();
  // Catch a missing "Editing as" name right at load time, not only when a
  // Save silently bails on it later (2026-08-18, per Shruti's report of an
  // edit that appeared to do nothing).
  if(!getName()) highlightWhoName();
  loadStatusOptions();
  updateSortHeaders('lead');
  updateSortHeaders('booking');
  doSearch();
}

function logout(){
  localStorage.removeItem('ws_admin_pw');
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  document.getElementById('gatePw').value='';
}

function saveName(){
  localStorage.setItem('ws_admin_name', document.getElementById('whoName').value.trim());
}

// 2026-08-19, per Shruti — "Create 2 tables on admin panel - 1 for leads, 1
// for bookings. if there are new entries, show a bubble with the number of
// new bookings to intimate the user of new entries". Both tables share the
// same search box; the tab switcher just toggles which one is visible.
let ACTIVE_TAB = 'lead';
function switchTab(tab){
  ACTIVE_TAB = tab;
  document.getElementById('tabLeadBtn').classList.toggle('active', tab==='lead');
  document.getElementById('tabBookingBtn').classList.toggle('active', tab==='booking');
  document.getElementById('leadTableWrap').style.display = tab==='lead' ? 'block' : 'none';
  document.getElementById('bookingTableWrap').style.display = tab==='booking' ? 'block' : 'none';
}
function updateBubble(id, count){
  const el = document.getElementById(id);
  if(!el) return;
  if(count>0){ el.textContent = count; el.style.display='inline-block'; }
  else{ el.style.display='none'; }
}

// ── List sorting ────────────────────────────────────────────────────────
// 2026-08-19, per Shruti follow-up: "give sort on status, created, event
// date. on clicking - the values should get sorted in desc/asc. applicable
// for bookings and leads." Leads and Bookings each keep their own
// independent sort state (matching them each having their own tab/query).
// Clicking a new column defaults to ascending; clicking the active column
// again flips asc/desc. Keys must match backend SORTABLE_COLUMNS in
// routers/admin.py (status/created/event_date).
let SORT_STATE = { lead: {key:'created', dir:'desc'}, booking: {key:'created', dir:'desc'} };
function toggleSort(kind, key){
  const s = SORT_STATE[kind];
  if(s.key===key){ s.dir = s.dir==='asc' ? 'desc' : 'asc'; }
  else{ s.key = key; s.dir = 'asc'; }
  updateSortHeaders(kind);
  loadTable(kind, document.getElementById('searchQ').value.trim());
}
function updateSortHeaders(kind){
  const s = SORT_STATE[kind];
  ['status','event_date','created'].forEach(k=>{
    const el = document.getElementById('arrow-'+kind+'-'+k);
    if(!el) return;
    el.textContent = (s.key===k) ? (s.dir==='asc' ? '▲' : '▼') : '';
  });
}

async function doSearch(){
  const q = document.getElementById('searchQ').value.trim();
  await Promise.all([loadTable('lead', q), loadTable('booking', q)]);
}
async function loadTable(kind, q){
  const bodyId = kind==='lead' ? 'leadBody' : 'bookingBody';
  const emptyId = kind==='lead' ? 'leadEmpty' : 'bookingEmpty';
  const bubbleId = kind==='lead' ? 'leadBubble' : 'bookingBubble';
  const body = document.getElementById(bodyId);
  const empty = document.getElementById(emptyId);
  body.innerHTML = '<tr><td colspan="7" style="padding:16px;color:#6B7280">Loading...</td></tr>';
  try{
    const s = SORT_STATE[kind];
    const path = '/api/admin/bookings?kind='+kind+(q?('&q='+encodeURIComponent(q)):'')+'&sort='+s.key+'&dir='+s.dir;
    const d = await apiCall(path);
    const rows = d.rows||[];
    updateBubble(bubbleId, d.new_count||0);
    if(!rows.length){ body.innerHTML=''; empty.style.display='block'; return; }
    empty.style.display='none';
    body.innerHTML = rows.map(r=>{
      return '<tr onclick="openBooking('+r.lead_id+')">'
        +'<td>#'+r.lead_id+'</td>'
        +'<td>'+esc(r.parent_name||'')+'</td>'
        +'<td>'+esc(r.phone||'')+'</td>'
        +'<td>'+esc(r.event_date||'—')+'</td>'
        +'<td>'+esc(r.city||'—')+'</td>'
        +'<td>'+listStatusCellHtml(r, kind)+'</td>'
        +'<td>'+esc(r.created_on_ist||'')+'</td>'
        +'<td>'+listActionsCellHtml(r, kind)+'</td>'
        +'</tr>';
    }).join('');
  }catch(e){
    if(e.message!=='unauthorized') showToast(e.message);
  }
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

// 2026-08-19, per Shruti (reworked same day into the Leads/Bookings split —
// "convert to booking and save status buttons are not eligible for confirmed
// bookings. For confirmed bookings, only give option to cancel" / "No need
// of cancel button for leads. We can use the status to update
// cancelled/not interested leads" / "For confirmed bookings, show status as
// read only ... Add a Cancel button on right side of each row."). Leads get
// an editable status dropdown + a Convert action; bookings get a read-only
// status pill + a Cancel-only action. The detail page's fuller version (with
// the non-conversion reason picker) is in renderDetail()/statusBlockHtml().
function listStatusCellHtml(r, kind){
  const cls = 'status-'+(r.status||'').replace(/[^A-Za-z]/g,'');
  if(kind==='booking' || !LEAD_STATUS_OPTIONS.length){
    return '<span class="status-pill '+cls+'">'+esc(r.status||'')+'</span>';
  }
  const opts = LEAD_STATUS_OPTIONS.map(o=>'<option value="'+esc(o.value)+'"'+(o.value===r.status?' selected':'')+'>'+esc(o.label)+'</option>').join('');
  return '<select class="status-pill '+cls+'" style="border:none;font:inherit;padding:3px 6px" '
    +'onclick="event.stopPropagation()" onchange="event.stopPropagation();quickSetStatus('+r.lead_id+',this.value)">'+opts+'</select>';
}
function listActionsCellHtml(r, kind){
  if(kind==='lead'){
    return '<button class="mini-btn" style="border-color:var(--sgr);color:#166534" onclick="event.stopPropagation();quickConvert('+r.lead_id+')">Convert</button>';
  }
  if(r.status==='Cancelled') return '';
  return '<button class="mini-btn remove" onclick="event.stopPropagation();quickCancel('+r.lead_id+')">Cancel</button>';
}
async function quickSetStatus(leadId, newStatus){
  const who = getName();
  if(!who){ showToast('Set "Editing as" name at the top first.'); doSearch(); return; }
  try{
    // "Converted" is dropdown-only (never a stored lead status) — the backend
    // special-cases it into the same is_booking flip as the Convert button
    // and echoes is_booking:true, so the toast here should say "converted",
    // not "status updated to Converted" (2026-08-19, per Shruti follow-up).
    const result = await apiCall('/api/admin/bookings/'+leadId+'/status', {
      method:'POST',
      body: JSON.stringify({status:newStatus, changed_by:who}),
    });
    if(result && result.is_booking){
      showToast('✓ Converted to booking — moved to the Bookings tab.');
    }else{
      showToast('✓ Status updated to '+newStatus+(NON_CONVERT_STATUSES.includes(newStatus) ? ' — open the lead to record a reason.' : '.'));
    }
    doSearch();
  }catch(e){
    if(e.message!=='unauthorized') showToast(e.message);
    doSearch();
  }
}
async function quickConvert(leadId){
  const who = getName();
  if(!who){ showToast('Set "Editing as" name at the top first.'); return; }
  if(!confirm('Convert this lead into a confirmed booking?')) return;
  try{
    await apiCall('/api/admin/bookings/'+leadId+'/convert', {
      method:'POST',
      body: JSON.stringify({changed_by:who}),
    });
    showToast('✓ Converted to booking.');
    doSearch();
  }catch(e){
    if(e.message!=='unauthorized') showToast(e.message);
  }
}

// JSON.stringify() produces double-quoted strings, and every onclick="..."
// attribute below is ALSO double-quoted — embedding one directly inside the
// other truncates the attribute at the first quote (e.g. onclick="saveField("
// with the rest spilling out as broken HTML), which the browser then fails
// to compile as a click handler ("Uncaught SyntaxError: Unexpected end of
// input") — silently, with zero network request and no visible error unless
// you have the console open. This is the actual root cause of every
// "I clicked Save and nothing happened" report (2026-08-18, per Shruti) —
// esc() HTML-escapes the embedded quotes so the attribute parses correctly.
function attrJson(v){ return esc(JSON.stringify(v)); }

async function openBooking(id){
  CURRENT_LEAD_ID = id;
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='block';
  await loadDetail();
}

function backToList(){
  CURRENT_LEAD_ID = null;
  document.getElementById('detailView').style.display='none';
  document.getElementById('listView').style.display='block';
  // 2026-08-18, per Shruti: this used to just toggle visibility without
  // re-fetching, so the list still showed pre-edit values (e.g. an old
  // parent name) after saving a change and coming back — looked like the
  // edit never happened. Refresh for real.
  doSearch();
}

async function loadDetail(){
  try{
    const d = await apiCall('/api/admin/bookings/'+CURRENT_LEAD_ID);
    CURRENT_DETAIL = d;
    renderDetail(d);
  }catch(e){
    if(e.message!=='unauthorized') showToast(e.message);
  }
}

// ── Status card (lead pipeline / convert / cancel) — detail page ──────────
// 2026-08-19, per Shruti (reworked same day) — see listStatusCellHtml()
// above for the summary-page equivalent. Branches on d.is_booking: a
// confirmed booking shows its status read-only (New/Upcoming/Complete/
// Cancelled, computed server-side) with only a Cancel action; a lead shows
// the full editable pipeline dropdown + non-conversion reason picker + a
// Convert-to-Booking action, with no Cancel button ("we use the status to
// update cancelled/not interested leads" instead).
function statusBlockHtml(d){
  if(d.is_booking){
    const cls = 'status-'+(d.status||'').replace(/[^A-Za-z]/g,'');
    return '<div class="status-card">'
      +'<div class="fld"><label>Status</label><span class="status-pill '+cls+'" style="padding:8px 14px;font-size:13px">'+esc(d.status||'')+'</span></div>'
      +'<div class="btns">'
        +(d.status!=='Cancelled' ? '<button class="btn cancel" onclick="cancelEventDetail()">Cancel Event</button>' : '')
      +'</div>'
      +'</div>';
  }
  const opts = LEAD_STATUS_OPTIONS.map(o=>'<option value="'+esc(o.value)+'"'+(o.value===d.status?' selected':'')+'>'+esc(o.label)+'</option>').join('');
  const showReason = NON_CONVERT_STATUSES.includes(d.status);
  const reasonOpts = ['<option value="">— Select —</option>'].concat(
    NON_CONVERT_REASON_OPTIONS.map(o=>'<option value="'+esc(o.value)+'"'+(o.value===d.non_convert_reason?' selected':'')+'>'+esc(o.label)+'</option>')
  ).join('');
  const isOthers = d.non_convert_reason==='Others';
  return '<div class="status-card">'
    +'<div class="fld"><label>Status</label><select id="statusSel" onchange="onStatusDropdownChange()">'+opts+'</select></div>'
    +'<div class="fld" id="reasonFld" style="display:'+(showReason?'flex':'none')+'">'
      +'<label>Reason (not converted)</label><select id="statusReasonSel" onchange="onStatusReasonChange()">'+reasonOpts+'</select></div>'
    +'<div class="fld" id="reasonOtherFld" style="display:'+(showReason&&isOthers?'flex':'none')+'">'
      +'<label>Please specify</label><input type="text" id="statusReasonOther" value="'+esc(d.non_convert_reason_other||'')+'"></div>'
    +'<div class="btns">'
      +'<button class="btn convert" onclick="convertLeadDetail()">Convert to Booking</button>'
      +'<button class="btn save" onclick="saveDetailStatus()">Save Status</button>'
    +'</div>'
    +'</div>';
}
function onStatusDropdownChange(){
  const status = document.getElementById('statusSel').value;
  const show = NON_CONVERT_STATUSES.includes(status);
  document.getElementById('reasonFld').style.display = show?'flex':'none';
  document.getElementById('reasonOtherFld').style.display = 'none';
}
function onStatusReasonChange(){
  const isOthers = document.getElementById('statusReasonSel').value==='Others';
  document.getElementById('reasonOtherFld').style.display = isOthers?'flex':'none';
}
// Lead-only — saves the status dropdown (+ non-conversion reason, if any)

      method:'POST',

    if(e.message!=='unauthorized') showToast(e.message);

}

function renderDetail(d){
  document.getElementById('detTitle').textContent = (d.is_booking?'Booking #':'Lead #')+d.lead_id;
  document.getElementById('detMeta').textContent = 'Status: '+d.status+' · Created '+d.created_on_ist;

  // Prefer the options bundled with this response (always fresh/available)
  // over the boot-time cache, which may not have resolved yet.
  if(d.lead_status_options && d.lead_status_options.length) LEAD_STATUS_OPTIONS = d.lead_status_options;
  if(d.non_convert_reason_options && d.non_convert_reason_options.length) NON_CONVERT_REASON_OPTIONS = d.non_convert_reason_options;
  document.getElementById('statusBlock').innerHTML = statusBlockHtml(d);

  // 2026-08-19, per Shruti follow-up: "if a booking is marked as cancelled,
  // no further updates can be done on the values of the booking. same for
  // leads that are marked as not converted." d.locked comes straight from
  // the backend's _is_locked() — the frontend just reflects it (a banner +
  // read-only field rows below); update_booking_field() enforces it for
  // real, so this is purely a UX cue, not the source of truth.
  const lockBanner = document.getElementById('lockBanner');
  if(d.locked){
    const msg = d.is_booking
      ? '🔒 This event is cancelled — its details are locked and can no longer be edited.'
      : '🔒 This lead is marked "'+esc(d.status||'')+'" — its details are locked and can no longer be edited. Change the status above to unlock it.';
    lockBanner.innerHTML = '<div class="lock-banner">'+msg+'</div>';
  }else{
    lockBanner.innerHTML = '';
  }

  const container = document.getElementById('sectionsContainer');
  container.innerHTML = d.sections.map(sec=>{
    const isCustEvent = sec.section==='Customer & Event Details';
    const col3Label = isCustEvent ? 'Updated Value' : 'Assigned Value';
    const rowsHtml = sec.fields.map(f=>fieldRowHtml(f, isCustEvent, d.locked)).join('');
    return '<div class="section-block">'
      +'<h3>'+esc(sec.section)+'</h3>'
      +'<table class="fields"><thead><tr><th>Field</th><th>Current Value</th><th>'+col3Label+'</th><th>Remarks</th><th></th></tr></thead>'
      +'<tbody id="sec-'+secId(sec.section)+'">'+rowsHtml+'</tbody></table>'
      +(d.locked ? '' : '<button class="add-field-btn" onclick="addCustomField('+attrJson(sec.section)+')">+ Add field to '+esc(sec.section)+'</button>')
      +'</div>';
  }).join('');

  const log = document.getElementById('logContainer');
  if(!d.change_log.length){
    log.innerHTML = '<div class="empty">No edits yet — this booking still reflects exactly what the customer submitted.</div>';
  }else{
    log.innerHTML = d.change_log.map(l=>'<div class="log-entry">'+esc(l.sentence)+'</div>').join('');
  }

  // Snapshot every row's freshly-rendered values so checkRowDirty() below has
  // a baseline to compare against as the admin types (2026-08-19, per
  // Shruti — "highlight the row wherever the user is changing any value").
  container.querySelectorAll('tr[id^="fld_"]').forEach(row=>{
    row.classList.remove('dirty');
    row.dataset.initial = rowSnapshot(row.id);
  });
}

function secId(name){ return name.replace(/[^A-Za-z0-9]/g,''); }

// ── Dirty-row highlighting ──────────────────────────────────────────────
// Compares a row's live Current Value / Updated Value / Remarks against what
// was there right after the last render (or last save) and toggles a
// highlight while they differ — a visual "you have unsaved edits here" cue.
// Delegated once on the container (not re-attached per render) so it also
// picks up the Activities/Gifts multi-picker's dynamically added rows.
function rowSnapshot(rid){
  const cc = document.getElementById(rid+'_cc');
  const av = document.getElementById(rid+'_av');
  const rm = document.getElementById(rid+'_rm');
  return JSON.stringify([cc?cc.value:null, av?av.value:null, rm?rm.value:null]);
}
function checkRowDirty(rid){
  const row = document.getElementById(rid);
  if(!row || row.dataset.initial===undefined) return;
  row.classList.toggle('dirty', rowSnapshot(rid) !== row.dataset.initial);
}
(function initDirtyTracking(){
  const container = document.getElementById('sectionsContainer');
  const handler = e=>{ const row=e.target.closest('tr[id^="fld_"]'); if(row) checkRowDirty(row.id); };
  container.addEventListener('input', handler);
  container.addEventListener('change', handler);
})();

function selectHtml(id, options, current, extraAttrs){
  // Accepts either plain strings or {value,label} objects; normalizes to the latter.
  const opts = options.map(o=> (typeof o==='string') ? {value:o,label:o} : o);
  if(current && !opts.some(o=>o.value===current)) opts.unshift({value:current, label:current});
  return '<select id="'+id+'"'+(extraAttrs||'')+'>'
    + opts.map(o=>'<option value="'+esc(o.value)+'"'+(o.value===current?' selected':'')+'>'+esc(o.label)+'</option>').join('')
    + '</select>';
}

// ── Multi-select picker (Activities / Gifts) ───────────────────────────
// A booking can have several activities or gifts, so a single <select> can't
// hold "Current Value" for these two fields — instead this renders one row
// per selected item (+ a per-item quantity for gifts), with "+ Add" to add
// another row. Whatever the rows currently say is kept mirrored into a
// hidden #{rid}_cc input, so saveField()'s existing generic
// `document.getElementById(rid+'_cc').value` read path needs no changes at
// all to pick this up (2026-08-18, per Shruti — "+ for multi-select").
const MP_OPTIONS = {}, MP_STATE = {}, MP_WITHQTY = {};

function mpParse(str, withQty){
  if(!str) return [];
  return str.split(',').map(s=>s.trim()).filter(Boolean).map(seg=>{
    if(withQty){
      const m = seg.match(/^(.*)\s+x(\d+)$/i);
      if(m) return {v:m[1].trim(), q:parseInt(m[2],10)||1};
    }
    return {v:seg, q:1};
  });
}

function multiPickerHtml(rid, options, currentStr, withQty){
  MP_OPTIONS[rid] = options;
  MP_WITHQTY[rid] = !!withQty;
  MP_STATE[rid] = mpParse(currentStr, withQty);
  const addLabel = withQty ? '+ Add gift' : '+ Add activity';
  return '<div class="mp-wrap">'
    +'<input type="hidden" id="'+rid+'_cc" value="'+esc(currentStr||'')+'">'
    +'<div class="mp-rows" id="'+rid+'_mprows">'+mpRowsHtml(rid)+'</div>'
    +'<button type="button" class="mini-btn" onclick="mpAdd('+attrJson(rid)+')">'+addLabel+'</button>'
    +'</div>';
}

function mpRowsHtml(rid){
  const rows = MP_STATE[rid]||[];
  if(!rows.length) return '<div class="mp-empty">None selected.</div>';
  const withQty = MP_WITHQTY[rid];
  return rows.map((r,i)=>{
    const opts = [{value:'', label:'— Select —'}].concat(MP_OPTIONS[rid]||[]);
    const sel = selectHtml(rid+'_mps'+i, opts, r.v, ' onchange="mpUpdate('+attrJson(rid)+','+i+',this.value,null)"');
    const qtyHtml = withQty ? '<input type="number" min="1" class="mp-qty" value="'+esc(r.q)+'" oninput="mpUpdate('+attrJson(rid)+','+i+',null,this.value)">' : '';
    return '<div class="mp-row">'+sel+qtyHtml+'<button type="button" class="mini-btn remove" onclick="mpRemove('+attrJson(rid)+','+i+')">✕</button></div>';
  }).join('');
}

function mpRerender(rid){
  const wrap = document.getElementById(rid+'_mprows');
  if(wrap) wrap.innerHTML = mpRowsHtml(rid);
  mpSync(rid);
  // +Add/✕ are button clicks, not input/change on the row itself, so the
  // delegated listener in initDirtyTracking() never sees them — call this
  // directly so adding/removing an activity or gift still highlights the row.
  checkRowDirty(rid);
}

function mpAdd(rid){
  MP_STATE[rid] = MP_STATE[rid] || [];
  MP_STATE[rid].push({v:'', q:1});
  mpRerender(rid);
}

function mpRemove(rid, idx){
  if(MP_STATE[rid]) MP_STATE[rid].splice(idx,1);
  mpRerender(rid);
}

function mpUpdate(rid, idx, val, qty){
  const row = (MP_STATE[rid]||[])[idx];
  if(!row) return;
  if(val!==null) row.v = val;
  if(qty!==null) row.q = Math.max(1, parseInt(qty,10)||1);
  mpSync(rid);
}

function mpSync(rid){
  const withQty = MP_WITHQTY[rid];
  const rows = (MP_STATE[rid]||[]).filter(r=>r.v);
  const str = rows.map(r=> withQty ? (r.v+' x'+(r.q||1)) : r.v).join(', ');
  const hidden = document.getElementById(rid+'_cc');
  if(hidden) hidden.value = str;
}

function fieldRowHtml(f, isCustEvent, locked){
  const rid = 'fld_'+f.field_key;
  const removedCls = f.removed ? ' removed' : '';
  // "None selected" instead of a blank note when the customer genuinely left
  // this field empty at checkout (2026-08-19, per Shruti) — distinguishes
  // "we know they selected nothing" from "we have no data for this field".
  const originalNote = f.admin_only ? '<small>Admin-tracked</small>' : ('<small>Original: '+esc(f.original_value || 'None selected')+'</small>');

  // ── Read-only fields (Grand Total / Balance Due): plain display, no editing at all
  if(f.read_only){
    // 2026-08-19, per Shruti: Balance Due is now live (Grand Total − Advance
    // Paid, recalculated on every load) — Grand Total itself still isn't
    // re-derived from today's service selections (it's the amount the
    // customer actually agreed to pay at checkout), so the two get different notes.
    const note = f.field_key==='bill_balance'
      ? 'Auto-calculated: Grand Total − Advance Paid (updates as soon as Advance Paid is saved).'
      : 'Captured at checkout — not re-calculated when services/overrides change here.';
    return '<tr id="'+rid+'" data-key="'+esc(f.field_key)+'">'
      +'<td class="field-label">'+esc(f.label)+'</td>'
      +'<td colspan="3"><span class="readonly-cell computed">'+esc(f.customer_choice||'—')+'<span class="computed-note">'+note+'</span></span></td>'
      +'<td></td>'
      +'</tr>';
  }

  // ── Locked (cancelled booking / non-converted lead): every remaining
  // field renders as plain read-only text — no inputs, no Save/Remove —
  // mirroring the 400 that update_booking_field() would otherwise return
  // (2026-08-19, per Shruti follow-up: "no further updates can be done on
  // the values"). Multi-select fields (Activities/Gifts) just show their
  // raw comma-joined string here rather than the row-per-item picker.
  if(locked){
    return '<tr id="'+rid+'" class="'+removedCls.trim()+'" data-key="'+esc(f.field_key)+'">'
      +'<td class="field-label">'+esc(f.label)+originalNote+'</td>'
      +'<td><span class="readonly-cell">'+esc(f.customer_choice||'—')+'</span></td>'
      +'<td><span class="readonly-cell">'+esc(f.assigned_value||'—')+'</span></td>'
      +'<td><span class="readonly-cell">'+esc(f.remarks||'—')+'</span></td>'
      +'<td></td>'
      +'</tr>';
  }

  // ── Customer's Choice cell ──
  let ccCell;
  if(!f.choice_editable){
    // Customer & Event Details: read-only, greyed, shows the frozen original
    ccCell = '<span class="readonly-cell">'+esc(f.customer_choice||'—')+'</span>';
  }else if(f.multi_options){
    // Activities / Gifts — several items per booking, so this is a row-per-item
    // picker (see multiPickerHtml) rather than a single <select> (2026-08-18,
    // per Shruti — "+ for multi-select", pricing shown in each option's label).
    ccCell = multiPickerHtml(rid, f.multi_options, f.customer_choice||'', f.multi_with_qty);
  }else if(f.options){
    ccCell = selectHtml(rid+'_cc', f.options, f.customer_choice||'');
  }else{
    ccCell = '<input type="text" id="'+rid+'_cc" value="'+esc(f.customer_choice||'')+'" placeholder="'+(f.admin_only?'—':'(use original)')+'">';
  }

  // ── Updated / Assigned Value cell ──
  let avValue = f.assigned_value || '';
  if(isCustEvent && !f.has_override && !avValue){
    avValue = f.customer_choice || '';  // pre-fill with customer's value until first edit
  }
  // child_ages/child_genders/child_dobs can hold several comma-joined values
  // for multi-child bookings ("6, 8") — a native number/date/select input
  // can't represent that, so those three only get the specialised control
  // when there's a single value; otherwise they fall through to the generic
  // text input below (still validated server-side as a comma-list).
  const isMultiChild = /,/.test(avValue);
  const avPlaceholder = f.placeholder || (isCustEvent ? '' : 'Assign...');
  let avCell;
  if(f.field_key==='child_genders' && !isMultiChild){
    avCell = selectHtml(rid+'_av', GENDER_OPTIONS, avValue);
  }else if(f.field_key==='email'){
    avCell = '<input type="email" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder||'name@example.com')+'">';
  }else if(f.field_key==='child_ages' && !isMultiChild){
    avCell = '<input type="number" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder)+'" min="0" max="18">';
  }else if(f.field_key==='child_dobs' && !isMultiChild){
    avCell = '<input type="date" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder)+'">';
  }else if(f.field_key==='event_date'){
    avCell = '<input type="date" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder)+'">';
  }else if(f.field_key==='event_time'){
    avCell = '<input type="time" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder)+'">';
  }else if(f.field_key==='pincode'){
    avCell = '<input type="text" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder||'6-digit pincode')+'" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" oninput="this.value=this.value.replace(/[^0-9]/g,\'\').slice(0,6);onPincodeInput(this.value);">';
  }else if(f.field_key==='city'){
    // 2026-08-19, per Shruti: City is auto-filled from Pincode (see
    // PINCODE_CITY_MAP/onPincodeInput() above) and should not be hand-typed
    // — readonly (not disabled) so onPincodeInput() can still set .value
    // programmatically and Save still picks it up.
    avCell = '<input type="text" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder||'Auto-fills from pincode')+'" readonly style="background:var(--lgy);cursor:not-allowed">';
  }else{
    const numAttrs = f.field_key==='bill_discount_pct' ? ' step="0.01" min="0" max="100"'
                    : f.field_key==='bill_advance' ? ' step="0.01" min="0"' : '';
    const avInputType = (f.field_key==='bill_discount_pct'||f.field_key==='bill_advance') ? 'number' : 'text';
    avCell = '<input type="'+avInputType+'" id="'+rid+'_av" value="'+esc(avValue)+'" placeholder="'+esc(avPlaceholder)+'"'+numAttrs+'>';
  }

  const actions = isCustEvent
    ? ''
    : (f.removed
        ? '<button class="mini-btn restore" onclick="toggleRemoved('+attrJson(f.field_key)+', false)">Restore</button>'
        : '<button class="mini-btn remove" onclick="toggleRemoved('+attrJson(f.field_key)+', true)">Remove</button>');

  return '<tr id="'+rid+'" class="'+removedCls.trim()+'" data-key="'+esc(f.field_key)+'">'
    +'<td class="field-label">'+esc(f.label)+originalNote+'</td>'
    +'<td>'+ccCell+'</td>'
    +'<td>'+avCell+'</td>'
    +'<td><textarea id="'+rid+'_rm" placeholder="Remarks...">'+esc(f.remarks||'')+'</textarea></td>'
    +'<td><div class="row-actions">'
      +'<button class="mini-btn save" onclick="saveField('+attrJson(f.field_key)+', false)">Save</button>'
      +actions
    +'</div></td>'
    +'</tr>';
}

// 2026-08-18, per Shruti: a Save click that silently did nothing (no toast,
// no error, no DB change) turned out to have no single reproducible cause
// we could pin down from the code alone — so this function is now wrapped
// end-to-end (including the DOM reads that used to run BEFORE the try
// block, where a missing/renamed element would throw and abort with zero
// visible feedback) so that *any* failure surfaces a toast instead of
// failing silently. If it happens again, the toast text is the diagnosis.
async function saveField(key, removedOverride){
  try{
    const rid = 'fld_'+key;
    const ccEl = document.getElementById(rid+'_cc');
    const cc = ccEl ? ccEl.value : '';   // absent when Current Value is read-only for this row
    const avEl = document.getElementById(rid+'_av');
    const rmEl = document.getElementById(rid+'_rm');
    const row = document.getElementById(rid);
    if(!avEl || !row){ showToast('Could not find that field on the page — try refreshing.'); return; }
    const av = avEl.value;
    const rm = rmEl ? rmEl.value : '';
    const removed = (removedOverride!==undefined) ? removedOverride : row.classList.contains('removed');
    const who = getName();
    if(!who){ showToast('⚠ Set "Editing as" name at the top first — nothing was saved.'); highlightWhoName(); return; }

    const result = await apiCall('/api/admin/bookings/'+CURRENT_LEAD_ID+'/field', {
      method:'POST',
      body: JSON.stringify({
        field_key: key,
        customer_choice_override: cc,
        assigned_value: av,
        remarks: rm,
        removed: removed,
        changed_by: who,
      }),
    });
    showToast(saveResultMessage(result));
    await loadDetail();
  }catch(e){
    console.error('saveField failed:', e);
    showToast(e.message==='unauthorized' ? 'Session expired — please log in again.' : ('Save failed: '+e.message));
  }
}

// Builds a specific "Parent Name: Aditya → Janani" style confirmation from
// what the server actually changed, instead of a generic "Saved." — so it's
// obvious an edit landed (or, if changes_logged is 0, that nothing about the
// value actually differed from what was already there).
function saveResultMessage(result){
  if(!result || !result.changes_logged) return 'Saved — no change detected (value was already the same).';
  const valueChange = (result.log_entries||[]).find(e=>e.change_type==='field_value'||e.change_type==='customer_choice'||e.change_type==='assigned_value');
  if(valueChange){
    const oldV = valueChange.old_value || '—';
    const newV = valueChange.new_value || '—';
    return '✓ Saved — '+(result.field_label||result.field_key)+': '+oldV+' → '+newV;
  }
  return '✓ Saved — '+(result.field_label||result.field_key)+' updated.';
}

function highlightWhoName(){
  const el = document.getElementById('whoName');
  el.style.borderColor = 'var(--pk)';
  el.placeholder = 'Enter your name';
  el.focus();
}

function toggleRemoved(key, removed){ saveField(key, removed); }

function addCustomField(section){
  const label = prompt('New field name (e.g. "Piñata Bags", "Balloon Arch"):');
  if(!label || !label.trim()) return;
  const key = 'custom_'+label.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')+'_'+Date.now();
  const who = getName();
  if(!who){ showToast('Set "Editing as" name at the top first.'); return; }
  apiCall('/api/admin/bookings/'+CURRENT_LEAD_ID+'/field', {
    method:'POST',
    body: JSON.stringify({
      field_key: key,
      field_label: label.trim(),
      section: section,
      customer_choice_override: '',
      assigned_value: '',
      remarks: '',
      removed: false,
      changed_by: who,
    }),
  }).then(()=>{ showToast('Field added.'); loadDetail(); })
    .catch(e=>{ if(e.message!=='unauthorized') showToast(e.message); });
}

// ─── Boot ───
(function boot(){
  if(getPw()){
    apiCall('/api/admin/bookings').then(()=>enterApp()).catch(()=>{
      document.getElementById('gate').style.display='flex';
    });
  }
})();
</script>
